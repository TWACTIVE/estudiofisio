<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Beauty Golden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FBF9F4;
  --gold:#9A7B24;
  --gold-lt:#F4EDD8;
  --onyx:#211D14;
  --text:#28231A;
  --muted:#8A8172;
  --surface:#FFFFFF;
  --border:#EAE3D2;
}
body{background:#DDD5C2;font-family:'Raleway',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.phone{width:390px;height:844px;background:var(--bg);border-radius:44px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 32px 80px rgba(0,0,0,0.28),0 0 0 1px rgba(0,0,0,0.08)}
.status-bar{background:var(--onyx);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 24px 10px;font-size:12px;font-weight:500;flex-shrink:0}
.screen{flex:1;overflow-y:auto;overflow-x:hidden}
.screen::-webkit-scrollbar{display:none}
.tab-bar{background:var(--surface);border-top:1px solid var(--border);display:flex;flex-shrink:0;padding-bottom:16px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 4px;cursor:pointer}
.tab span{font-size:10px;font-weight:600;letter-spacing:0.04em}
.tab.active{color:var(--gold)}
.tab:not(.active){color:var(--muted)}
.tab-icon{width:22px;height:22px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.screen > *{animation:fadeUp 0.25s ease forwards}
.app-header{background:var(--onyx);padding:22px 24px 28px;color:#F5EFDF}
.wordmark{font-family:'Cinzel',serif;font-size:18px;letter-spacing:0.1em;text-transform:uppercase}
.wordmark span{color:#C9A94E}
.wordmark em{font-family:'Raleway',sans-serif;font-style:normal;opacity:0.6;font-size:11px;display:block;margin-top:3px;letter-spacing:0.16em}
.greeting{font-size:13px;font-weight:300;opacity:0.7;margin-top:18px}
.patient-name{font-family:'Cinzel',serif;font-size:20px;margin-top:3px;letter-spacing:0.04em}
.screen-title-bar{background:#fff;border-bottom:1px solid var(--border);padding:20px 20px 16px}
.screen-title{font-family:'Cinzel',serif;font-size:19px;color:var(--onyx);letter-spacing:0.06em;text-transform:uppercase}
.screen-sub{font-size:13px;color:var(--muted);margin-top:4px}
.section-label{font-size:10px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);padding:20px 20px 8px}
.card{background:var(--surface);border-radius:12px;padding:18px;margin:0 16px 12px;box-shadow:0 1px 6px rgba(33,29,20,0.08)}
.appt-card{background:linear-gradient(135deg,#211D14,#3A331F);color:#F5EFDF;border-radius:12px;padding:18px;margin:16px 16px 12px;border:1px solid #C9A94E}
.badge{background:#C9A94E;color:#211D14;border-radius:20px;padding:4px 11px;font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;float:right}
.item-ico{width:38px;height:38px;border-radius:10px;background:var(--gold-lt);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.item-name{font-size:14px;font-weight:700;color:var(--text)}
.item-sub{font-size:12px;color:var(--muted);margin-top:2px}
.chev{color:var(--muted);transition:transform 0.2s}
.chev.open{transform:rotate(180deg)}
.expand-body{background:#F7F3E8;padding:13px 16px;font-size:13px;color:var(--muted);line-height:1.6;border-top:1px solid var(--border)}
.chart-label{font-size:10px;fill:var(--muted);font-family:'Raleway',sans-serif}
.note-card{background:var(--gold-lt);border-left:3px solid var(--gold);border-radius:12px;padding:16px;margin:0 16px 12px}
.note-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:var(--gold);margin-bottom:6px}
.note-text{font-size:13px;color:var(--text);line-height:1.55}
.option-card{background:var(--surface);border-radius:10px;padding:14px 16px;margin:0 16px 8px;display:flex;align-items:center;gap:12px;cursor:pointer;border:1.5px solid var(--border)}
.time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 16px 16px}
.time-chip{background:var(--surface);border-radius:8px;padding:10px 6px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);color:var(--text)}
.time-chip.selected{background:var(--onyx);color:#C9A94E;border-color:var(--onyx)}
.time-chip.unavailable{background:#F0EBDD;color:#C3BAA6;cursor:default}
.confirm-btn{background:var(--onyx);color:#C9A94E;border-radius:10px;padding:16px;text-align:center;font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;margin:8px 16px 20px;cursor:pointer}
.success-card{background:linear-gradient(135deg,#211D14,#3A331F);color:#F5EFDF;border-radius:12px;padding:28px;margin:20px 16px;text-align:center;border:1px solid #C9A94E}
.msg-bubble{max-width:78%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.55;margin:4px 16px}
.msg-bubble.pro{background:var(--surface);color:var(--text);border-bottom-left-radius:3px;box-shadow:0 1px 4px rgba(33,29,20,0.08)}
.msg-bubble.user{background:var(--onyx);color:#F5EFDF;border-bottom-right-radius:3px;margin-left:auto}
.msg-time{font-size:10px;color:var(--muted);margin:2px 16px 10px}
.msg-time.right{text-align:right}
.msg-sender{font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);margin:12px 16px 4px}
.msg-input-row{background:var(--surface);border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;align-items:center;flex-shrink:0}
.msg-input{flex:1;background:var(--bg);border-radius:22px;padding:10px 16px;font-size:13px;font-family:'Raleway',sans-serif;border:none;outline:none;color:var(--text)}
.msg-send{width:38px;height:38px;border-radius:50%;background:var(--onyx);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const G="#9A7B24",O="#211D14",M="#8A8172";
const Icons={
  home:a=><svg viewBox="0 0 24 24" fill={a?G:"none"} stroke={a?G:M} strokeWidth="1.8" className="tab-icon"><path d="M3 9.5L12 3l9 6.5V21H3V9.5z" strokeLinejoin="round"/></svg>,
  plan:a=><svg viewBox="0 0 24 24" fill="none" stroke={a?G:M} strokeWidth="1.8" className="tab-icon"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4" strokeLinecap="round"/></svg>,
  prog:a=><svg viewBox="0 0 24 24" fill="none" stroke={a?G:M} strokeWidth="1.8" className="tab-icon"><path d="M3 17l5-5 4 4 9-9" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  book:a=><svg viewBox="0 0 24 24" fill="none" stroke={a?G:M} strokeWidth="1.8" className="tab-icon"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18" strokeLinecap="round"/></svg>,
  msg:a=><svg viewBox="0 0 24 24" fill="none" stroke={a?G:M} strokeWidth="1.8" className="tab-icon"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z" strokeLinejoin="round"/></svg>
};
const Chev=({open})=><svg viewBox="0 0 24 24" fill="none" stroke={M} strokeWidth="2" width="18" height="18" className={`chev${open?' open':''}`}><path d="M6 9l6 6 6-6"/></svg>;

function Home(){
  return <div>
    <div className="app-header">
      <div className="wordmark">My Beauty <span>Golden</span><em>Menéndez Pelayo 4 · Madrid</em></div>
      <div className="greeting">Bienvenida de nuevo,</div>
      <div className="patient-name">Carmen Estrada</div>
    </div>
    <div className="appt-card">
      <div className="badge">Confirmada</div>
      <div style={{fontSize:10,opacity:0.7,textTransform:'uppercase',letterSpacing:'0.14em'}}>Próxima cita</div>
      <div style={{fontFamily:"'Cinzel',serif",fontSize:19,marginTop:6,letterSpacing:'0.03em'}}>Sábado, 12 julio</div>
      <div style={{fontSize:13,opacity:0.85,marginTop:3}}>Manicura semipermanente + diseño · 11:00h · con Yolanda</div>
    </div>
    <div className="section-label">Ritual Golden</div>
    <div className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
        <span style={{fontFamily:"'Cinzel',serif",fontSize:17,color:G}}>8 visitas este año</span>
        <span style={{fontSize:11.5,color:M}}>2 más para tu ritual regalo</span>
      </div>
      <div style={{display:'flex',gap:6,marginTop:14}}>
        {Array.from({length:10}).map((_,i)=><div key={i} style={{flex:1,height:26,borderRadius:6,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,background:i<8?'var(--gold-lt)':'#F3EFE3',color:i<8?G:'#C3BAA6',fontWeight:700}}>{i<8?'★':'·'}</div>)}
      </div>
    </div>
    <div className="section-label">Tus favoritos</div>
    <div className="card" style={{marginBottom:12}}>
      {[['💅','Manicura semipermanente','Tono habitual: Nude Golden #114'],['👣','Pedicura spa','Cada 4 semanas'],['✨','Lifting de pestañas','Última: 2 junio']].map(([i,t,s])=>
        <div key={t} style={{display:'flex',alignItems:'center',gap:12,padding:'11px 0',borderBottom:'1px solid var(--border)'}}>
          <span style={{fontSize:18}}>{i}</span>
          <div style={{flex:1}}><div style={{fontSize:13.5,fontWeight:700}}>{t}</div><div style={{fontSize:11.5,color:M,marginTop:1}}>{s}</div></div>
        </div>)}
    </div>
    <div className="note-card" style={{marginBottom:24}}>
      <div className="note-label">Oferta de julio</div>
      <div className="note-text">Pedicura spa + manicura semipermanente el mismo día: <strong>−15%</strong>. Reserva ambas desde la app.</div>
    </div>
  </div>;
}

function Plan(){
  const [open,setOpen]=useState(null);
  const items=[
    ['🧴','Aceite de cutículas','Cada noche','Una gota por uña masajeando la cutícula. Alarga la duración del semipermanente y evita padrastros.'],
    ['🧤','Guantes para tareas de casa','Siempre','Los detergentes levantan el esmalte por los bordes. Guantes para fregar y productos de limpieza.'],
    ['💧','Crema de manos con SPF','2-3 veces al día','En verano las manos se manchan con el sol. Crema con SPF 30 y reaplicar tras lavarte las manos.'],
    ['🚫','No arrancar el esmalte','Nunca','Arrancar el semipermanente se lleva capas de la uña natural. Si un borde se levanta, ven y lo retiramos bien.'],
    ['👁','Sérum de pestañas','Cada noche · tras el lifting','Aplicar en la línea de las pestañas limpias. Mantiene el efecto del lifting y las nutre.'],
  ];
  return <div>
    <div className="screen-title-bar"><div className="screen-title">Cuidado en casa</div><div className="screen-sub">Recomendado por tu equipo Golden</div></div>
    <div style={{height:12}}/>
    {items.map(([ico,name,freq,det],i)=>
      <div key={i} style={{background:'#fff',borderRadius:12,margin:'0 16px 10px',overflow:'hidden',boxShadow:'0 1px 6px rgba(33,29,20,0.08)'}}>
        <div style={{display:'flex',alignItems:'center',gap:12,padding:'14px 18px',cursor:'pointer'}} onClick={()=>setOpen(open===i?null:i)}>
          <div className="item-ico">{ico}</div>
          <div style={{flex:1}}><div className="item-name">{name}</div><div className="item-sub">{freq}</div></div>
          <Chev open={open===i}/>
        </div>
        {open===i&&<div className="expand-body">{det}</div>}
      </div>)}
    <div className="note-card" style={{marginBottom:24}}>
      <div className="note-label">Nota de Yolanda</div>
      <div className="note-text">Tus uñas están mucho más fuertes desde que usamos la base de refuerzo. El sábado probamos el diseño francés dorado que te enseñé. ✨</div>
    </div>
  </div>;
}

function Progress(){
  const health=[5,6,6,7,7,8,8,9];
  const pts=health.map((v,i)=>`${32+i*40},${90-(v/10)*72}`).join(' ');
  return <div>
    <div className="screen-title-bar"><div className="screen-title">Tu historial</div><div className="screen-sub">Salud de uñas y pestañas</div></div>
    <div className="section-label">Fortaleza de la uña natural</div>
    <div className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:12}}>
        <div style={{fontFamily:"'Cinzel',serif",fontSize:25,color:O}}>9<span style={{fontSize:13,color:M,fontFamily:'Raleway'}}> / 10</span></div>
        <div style={{fontSize:11,color:G,fontWeight:700,letterSpacing:'0.08em'}}>↑ DESDE 5</div>
      </div>
      <svg viewBox="0 0 332 100" style={{width:'100%',height:100,display:'block'}}>
        {[2,5,8].map(v=><g key={v}><line x1="32" y1={90-(v/10)*72} x2="312" y2={90-(v/10)*72} stroke="#F0EBDD"/><text x="10" y={93-(v/10)*72} className="chart-label">{v}</text></g>)}
        <polyline points={pts} fill="none" stroke={G} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
        {health.map((v,i)=><circle key={i} cx={32+i*40} cy={90-(v/10)*72} r={i===7?4:2.5} fill={i===7?O:G}/>)}
        {['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago'].map((m,i)=><text key={m} x={32+i*40} y="100" className="chart-label" textAnchor="middle">{m}</text>)}
      </svg>
    </div>
    <div className="section-label">Últimos servicios</div>
    <div className="card" style={{marginBottom:12}}>
      {[['Manicura semi + diseño','14 junio','32€'],['Pedicura spa','14 junio','38€'],['Lifting de pestañas','2 junio','45€'],['Manicura semi','24 mayo','26€']].map(([s,d,p])=>
        <div key={s+d} style={{display:'flex',alignItems:'center',padding:'11px 0',borderBottom:'1px solid var(--border)'}}>
          <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700}}>{s}</div><div style={{fontSize:11,color:M,marginTop:2}}>{d}</div></div>
          <div style={{fontFamily:"'Cinzel',serif",fontSize:14,color:G}}>{p}</div>
        </div>)}
    </div>
    <div className="note-card" style={{marginBottom:24}}>
      <div className="note-label">Tu tono de siempre</div>
      <div className="note-text">Nude Golden #114 con acabado brillo. Guardamos tu fórmula para que cualquier técnico del equipo la replique exacta.</div>
    </div>
  </div>;
}

function Bookings(){
  const [step,setStep]=useState(0),[sel,setSel]=useState({}),[done,setDone]=useState(false);
  const pros=[['Yolanda','Manicura y diseño'],['Rocío','Pedicura spa'],['Alba','Pestañas y cejas'],['Primera disponible','Cualquier técnico']];
  const svcs=[['Manicura semipermanente','26€'],['Pedicura spa completa','38€'],['Lifting de pestañas','45€'],['Combo mani + pedi (−15%)','54€']];
  const times=['10:00','11:00','12:00','13:00','16:00','17:00','18:00','19:00','20:00'];
  const unav=['12:00','16:00','19:00'];
  if(done)return <div>
    <div className="screen-title-bar"><div className="screen-title">Reservas</div></div>
    <div className="success-card">
      <div style={{fontFamily:"'Cinzel',serif",fontSize:30,color:'#C9A94E',marginBottom:8}}>★</div>
      <div style={{fontFamily:"'Cinzel',serif",fontSize:19,marginBottom:6,letterSpacing:'0.05em'}}>Cita confirmada</div>
      <div style={{fontSize:13,opacity:0.85}}>{sel.pro} · {sel.svc}</div>
      <div style={{fontSize:13,opacity:0.85,marginTop:3}}>Menéndez Pelayo 4 · {sel.time}</div>
    </div>
    <div className="confirm-btn" onClick={()=>{setDone(false);setStep(0);setSel({})}}>Nueva reserva</div>
  </div>;
  return <div>
    <div className="screen-title-bar">
      <div className="screen-title">Reservas</div>
      <div style={{display:'flex',gap:6,marginTop:12}}>
        {['Técnico','Servicio','Hora'].map((s,i)=><div key={s} style={{flex:1,height:3,borderRadius:2,background:i<=step?G:'#EAE3D2'}}/>)}
      </div>
    </div>
    {step===0&&<><div className="section-label">Con quién</div>
      {pros.map(([n,r])=><div key={n} className="option-card" onClick={()=>{setSel({...sel,pro:n});setStep(1)}}>
        <div className="item-ico">💅</div><div><div className="item-name">{n}</div><div className="item-sub">{r}</div></div></div>)}</>}
    {step===1&&<><div className="section-label">Elige servicio</div>
      {svcs.map(([n,p])=><div key={n} className="option-card" onClick={()=>{setSel({...sel,svc:n});setStep(2)}}>
        <div style={{flex:1}}><div className="item-name">{n}</div></div><div style={{fontFamily:"'Cinzel',serif",fontSize:14,color:G}}>{p}</div></div>)}</>}
    {step===2&&<><div className="section-label">Hora · Sábado 12 julio</div>
      <div className="time-grid">{times.map(t=><div key={t} className={`time-chip${unav.includes(t)?' unavailable':sel.time===t?' selected':''}`} onClick={()=>!unav.includes(t)&&setSel({...sel,time:t})}>{t}</div>)}</div>
      {sel.time&&<div className="confirm-btn" onClick={()=>setDone(true)}>Confirmar</div>}</>}
  </div>;
}

function Messages(){
  const msgs=[
    ['pro','Yolanda','Carmen, ¡ya llegó el tono nuevo de la colección de verano! Un dorado champán precioso que te va a encantar.','Hace 3 días'],
    ['user',null,'¡Qué ganas de verlo! ¿Me lo enseñas el sábado?','Hace 3 días'],
    ['pro','Yolanda','Claro, te hago una uña de prueba antes de decidir. Y si quieres mantenemos tu #114 de base.','Hace 3 días'],
    ['pro','Recepción','Recuerda: 2 visitas más y tienes tu ritual Golden de regalo (masaje de manos con parafina). 🌟','Ayer'],
    ['user',null,'¡Ya casi! Hasta el sábado.','Hoy'],
  ];
  return <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
    <div className="screen-title-bar" style={{flexShrink:0}}><div className="screen-title">Mensajes</div><div className="screen-sub">My Beauty Golden · Menéndez Pelayo 4</div></div>
    <div style={{flex:1,overflowY:'auto',padding:'12px 0'}}>
      {msgs.map(([from,name,text,time],i)=><div key={i}>
        {from==='pro'&&<div className="msg-sender">{name}</div>}
        <div className={`msg-bubble ${from}`}>{text}</div>
        <div className={`msg-time${from==='user'?' right':''}`}>{time}</div>
      </div>)}
    </div>
    <div className="msg-input-row">
      <input className="msg-input" placeholder="Escribe un mensaje…" readOnly/>
      <div className="msg-send"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#C9A94E" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></div>
    </div>
  </div>;
}

function App(){
  const [tab,setTab]=useState(0);
  const screens=[Home,Plan,Progress,Bookings,Messages];
  const S=screens[tab];
  const tabs=[['Inicio',Icons.home],['Cuidado',Icons.plan],['Historial',Icons.prog],['Reservas',Icons.book],['Mensajes',Icons.msg]];
  return <div className="phone">
    <div className="status-bar"><span>9:41</span>
      <div style={{display:'flex',gap:6,alignItems:'center'}}>
        <svg width="16" height="12" viewBox="0 0 16 12"><rect x="0" y="3" width="3" height="9" rx="1" fill="white" opacity="0.4"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="white" opacity="0.6"/><rect x="9" y="0.5" width="3" height="11.5" rx="1" fill="white" opacity="0.8"/><rect x="13.5" y="0" width="2.5" height="12" rx="1" fill="white"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="1" width="22" height="10" rx="2" stroke="white" strokeWidth="1" fill="none" opacity="0.5"/><rect x="23" y="3.5" width="2" height="5" rx="1" fill="white" opacity="0.5"/><rect x="1.5" y="2.5" width="16" height="7" rx="1" fill="white"/></svg>
      </div>
    </div>
    <div className="screen" key={tab}><S/></div>
    <div className="tab-bar">{tabs.map(([l,I],i)=><div key={i} className={`tab${tab===i?' active':''}`} onClick={()=>setTab(i)}>{I(tab===i)}<span>{l}</span></div>)}</div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
