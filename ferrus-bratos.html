<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferrus & Bratos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Karla:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F5F3;
  --plum:#3D2645;
  --plum-mid:#5B3D66;
  --blush:#C98B8B;
  --text:#241A28;
  --muted:#75677B;
  --surface:#FFFFFF;
  --border:#E5DEE8;
}
body{background:#D9D2DC;font-family:'Karla',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.phone{width:390px;height:844px;background:var(--bg);border-radius:44px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 32px 80px rgba(0,0,0,0.28),0 0 0 1px rgba(0,0,0,0.08)}
.status-bar{background:var(--plum);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 24px 10px;font-size:12px;font-weight:500;flex-shrink:0}
.screen{flex:1;overflow-y:auto;overflow-x:hidden}
.screen::-webkit-scrollbar{display:none}
.tab-bar{background:var(--surface);border-top:1px solid var(--border);display:flex;flex-shrink:0;padding-bottom:16px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 4px;cursor:pointer}
.tab span{font-size:10px;font-weight:500}
.tab.active{color:var(--plum)}
.tab:not(.active){color:var(--muted)}
.tab-icon{width:22px;height:22px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.screen > *{animation:fadeUp 0.25s ease forwards}
.app-header{background:var(--plum);padding:20px 24px 26px;color:#fff}
.wordmark{font-family:'Libre Caslon Text',serif;font-size:17px;letter-spacing:0.01em}
.wordmark em{font-style:italic;opacity:0.7;font-size:12px;display:block;margin-top:2px}
.greeting{font-size:13px;font-weight:300;opacity:0.75;margin-top:16px}
.patient-name{font-family:'Libre Caslon Text',serif;font-size:21px;margin-top:3px}
.screen-title-bar{background:#fff;border-bottom:1px solid var(--border);padding:20px 20px 16px}
.screen-title{font-family:'Libre Caslon Text',serif;font-size:21px;color:var(--plum)}
.screen-sub{font-size:13px;color:var(--muted);margin-top:4px}
.section-label{font-size:11px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--muted);padding:20px 20px 8px}
.card{background:var(--surface);border-radius:14px;padding:18px;margin:0 16px 12px;box-shadow:0 1px 6px rgba(61,38,69,0.08)}
.appt-card{background:var(--plum);color:#fff;border-radius:14px;padding:18px;margin:16px 16px 12px}
.appt-label{font-size:11px;opacity:0.65;text-transform:uppercase;letter-spacing:0.07em}
.appt-date{font-family:'Libre Caslon Text',serif;font-size:19px;margin-top:5px}
.appt-detail{font-size:13px;opacity:0.8;margin-top:3px}
.badge{background:var(--blush);color:#3D2645;border-radius:20px;padding:4px 11px;font-size:11px;font-weight:700;float:right}
.item-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.item-row:last-child{border-bottom:none}
.item-ico{width:38px;height:38px;border-radius:10px;background:#F2ECF4;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.item-name{font-size:14px;font-weight:700;color:var(--text)}
.item-sub{font-size:12px;color:var(--muted);margin-top:2px}
.chip-status{font-size:10px;font-weight:700;border-radius:20px;padding:3px 9px;background:#F2ECF4;color:var(--plum)}
.expand-body{background:#F6F1F7;padding:13px 16px;font-size:13px;color:var(--muted);line-height:1.6;border-radius:0 0 14px 14px;border-top:1px solid var(--border)}
.chev{color:var(--muted);transition:transform 0.2s}
.chev.open{transform:rotate(180deg)}
.chart-label{font-size:10px;fill:var(--muted);font-family:'Karla',sans-serif}
.note-card{background:linear-gradient(135deg,#F2ECF4,#EDE3F0);border-left:3px solid var(--plum);border-radius:14px;padding:16px;margin:0 16px 12px}
.note-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--plum);margin-bottom:6px}
.note-text{font-size:13px;color:var(--text);line-height:1.55}
.option-card{background:var(--surface);border-radius:10px;padding:14px 16px;margin:0 16px 8px;display:flex;align-items:center;gap:12px;cursor:pointer;border:1.5px solid var(--border);transition:all 0.18s}
.option-card.selected{border-color:var(--plum);background:#F6F1F7}
.time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 16px 16px}
.time-chip{background:var(--surface);border-radius:8px;padding:10px 6px;text-align:center;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);color:var(--text)}
.time-chip.selected{background:var(--plum);color:#fff;border-color:var(--plum)}
.time-chip.unavailable{background:#EFEAF0;color:#BFB4C4;cursor:default}
.confirm-btn{background:var(--plum);color:#fff;border-radius:50px;padding:16px;text-align:center;font-size:15px;font-weight:700;margin:8px 16px 20px;cursor:pointer}
.success-card{background:linear-gradient(135deg,var(--plum),var(--plum-mid));color:#fff;border-radius:14px;padding:28px;margin:20px 16px;text-align:center}
.msg-bubble{max-width:78%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.55;margin:4px 16px}
.msg-bubble.pro{background:var(--surface);color:var(--text);border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(61,38,69,0.08)}
.msg-bubble.user{background:var(--plum);color:#fff;border-bottom-right-radius:4px;margin-left:auto}
.msg-time{font-size:10px;color:var(--muted);margin:2px 16px 10px}
.msg-time.right{text-align:right}
.msg-sender{font-size:11px;font-weight:700;color:var(--plum);margin:12px 16px 4px}
.msg-input-row{background:var(--surface);border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;align-items:center;flex-shrink:0}
.msg-input{flex:1;background:var(--bg);border-radius:22px;padding:10px 16px;font-size:13px;font-family:'Karla',sans-serif;border:none;outline:none;color:var(--text)}
.msg-send{width:38px;height:38px;border-radius:50%;background:var(--plum);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const C = "#3D2645", M = "#75677B";
const Icons = {
  home:a=><svg viewBox="0 0 24 24" fill={a?C:"none"} stroke={a?C:M} strokeWidth="1.8" className="tab-icon"><path d="M3 9.5L12 3l9 6.5V21H3V9.5z" strokeLinejoin="round"/></svg>,
  plan:a=><svg viewBox="0 0 24 24" fill="none" stroke={a?C:M} strokeWidth="1.8" className="tab-icon"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4" strokeLinecap="round"/></svg>,
  prog:a=><svg viewBox="0 0 24 24" fill="none" stroke={a?C:M} strokeWidth="1.8" className="tab-icon"><path d="M3 17l5-5 4 4 9-9" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  book:a=><svg viewBox="0 0 24 24" fill="none" stroke={a?C:M} strokeWidth="1.8" className="tab-icon"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18" strokeLinecap="round"/></svg>,
  msg:a=><svg viewBox="0 0 24 24" fill="none" stroke={a?C:M} strokeWidth="1.8" className="tab-icon"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z" strokeLinejoin="round"/></svg>
};
const Chev = ({open}) => <svg viewBox="0 0 24 24" fill="none" stroke="#75677B" strokeWidth="2" width="18" height="18" className={`chev${open?' open':''}`}><path d="M6 9l6 6 6-6"/></svg>;

function Home(){
  return <div>
    <div className="app-header">
      <div className="wordmark">Ferrus & Bratos<em>Clínica dental · Velázquez 58</em></div>
      <div className="greeting">Buenos días,</div>
      <div className="patient-name">Marta Domínguez</div>
    </div>
    <div className="appt-card">
      <div className="badge">Confirmada</div>
      <div className="appt-label">Próxima cita</div>
      <div className="appt-date">Miércoles, 9 julio</div>
      <div className="appt-detail">Dr. Bratos · 12:00h · Revisión de ortodoncia invisible</div>
    </div>
    <div className="section-label">Tu tratamiento</div>
    <div className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
        <span style={{fontFamily:"'Libre Caslon Text',serif",fontSize:17,color:C}}>Invisalign · Fase 2</span>
        <span style={{fontSize:12,color:M}}>Alineador 14 de 28</span>
      </div>
      <div style={{height:8,background:'#EFEAF0',borderRadius:4,overflow:'hidden',marginTop:12}}>
        <div style={{width:'50%',height:'100%',background:'linear-gradient(90deg,#3D2645,#C98B8B)',borderRadius:4}}/>
      </div>
      <div style={{fontSize:12,color:M,marginTop:8}}>Cambio de alineador: cada 10 días · Próximo cambio: 12 julio</div>
    </div>
    <div className="section-label">Accesos rápidos</div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,margin:'0 16px 16px'}}>
      {[['🦷','Mi ortodoncia'],['📸','Fotos de progreso'],['🧾','Presupuestos'],['📋','Historial clínico']].map(([i,l])=>
        <div key={l} style={{background:'#fff',borderRadius:10,padding:16,border:'1.5px solid var(--border)',cursor:'pointer'}}>
          <div style={{fontSize:22}}>{i}</div>
          <div style={{fontSize:12,fontWeight:700,marginTop:6,color:'var(--text)'}}>{l}</div>
        </div>)}
    </div>
    <div className="card" style={{marginBottom:24}}>
      <div className="section-label" style={{padding:'0 0 10px'}}>Recordatorio</div>
      <div style={{fontSize:13,color:'var(--text)',lineHeight:1.5}}>Usa los alineadores un mínimo de <strong>22 horas al día</strong>. Retíralos solo para comer y cepillarte.</div>
    </div>
  </div>;
}

function Plan(){
  const [open,setOpen]=useState(null);
  const items=[
    ['🦷','Alineadores Invisalign','22h/día · cambio cada 10 días','Retirar solo para comer y para la higiene. Limpiar el alineador con agua tibia y cepillo suave, nunca con agua caliente.'],
    ['🪥','Higiene tras cada comida','Cepillado + hilo dental','Cepillar antes de recolocar el alineador. Usar hilo dental al menos una vez al día, preferiblemente por la noche.'],
    ['💧','Colutorio con flúor','Cada noche','Enjuagar durante 1 minuto después del cepillado nocturno. No comer ni beber en los 30 minutos siguientes.'],
    ['🚫','Evitar bebidas con azúcar','Con el alineador puesto','Solo agua con el alineador puesto. Café, té o refrescos tiñen y deforman el plástico.'],
    ['😬','Chewies de asentamiento','10 min · 2 veces al día','Morder los chewies tras cada cambio de alineador para asegurar el ajuste completo sobre los dientes.'],
  ];
  return <div>
    <div className="screen-title-bar"><div className="screen-title">Plan de tratamiento</div><div className="screen-sub">Dr. Bratos · Ortodoncia invisible</div></div>
    <div style={{height:12}}/>
    {items.map(([ico,name,freq,det],i)=>
      <div key={i} style={{background:'#fff',borderRadius:14,margin:'0 16px 10px',overflow:'hidden',boxShadow:'0 1px 6px rgba(61,38,69,0.08)'}}>
        <div style={{display:'flex',alignItems:'center',gap:12,padding:'14px 18px',cursor:'pointer'}} onClick={()=>setOpen(open===i?null:i)}>
          <div className="item-ico">{ico}</div>
          <div style={{flex:1}}><div className="item-name">{name}</div><div className="item-sub">{freq}</div></div>
          <Chev open={open===i}/>
        </div>
        {open===i&&<div className="expand-body">{det}</div>}
      </div>)}
    <div className="note-card" style={{marginBottom:24}}>
      <div className="note-label">Nota del doctor</div>
      <div className="note-text">El movimiento dental avanza según lo previsto. En la próxima revisión haremos el escaneado intermedio para verificar el ajuste de la fase final.</div>
      <div style={{fontSize:11,color:M,marginTop:8}}>— Dr. Bratos, 20 junio 2025</div>
    </div>
  </div>;
}

function Progress(){
  const align=[2,4,6,8,10,12,13,14];
  const pts=align.map((v,i)=>`${32+i*40},${92-(v/28)*75}`).join(' ');
  return <div>
    <div className="screen-title-bar"><div className="screen-title">Tu progreso</div><div className="screen-sub">Ortodoncia · últimas 8 semanas</div></div>
    <div className="section-label">Alineadores completados</div>
    <div className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:12}}>
        <div style={{fontFamily:"'Libre Caslon Text',serif",fontSize:26,color:C}}>14 <span style={{fontSize:13,color:M,fontFamily:'Karla'}}>de 28</span></div>
        <div style={{fontSize:12,color:'#7A5A85',fontWeight:700}}>50% completado</div>
      </div>
      <svg viewBox="0 0 332 100" style={{width:'100%',height:100,display:'block'}}>
        {[7,14,21,28].map(v=><g key={v}><line x1="32" y1={92-(v/28)*75} x2="312" y2={92-(v/28)*75} stroke="#EFEAF0"/><text x="8" y={95-(v/28)*75} className="chart-label">{v}</text></g>)}
        <polyline points={pts} fill="none" stroke={C} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
        {align.map((v,i)=><circle key={i} cx={32+i*40} cy={92-(v/28)*75} r={i===7?4:2.5} fill={i===7?"#C98B8B":C}/>)}
        {['May','Jun','Jul','Ago'].map((m,i)=><text key={m} x={32+i*80} y="100" className="chart-label" textAnchor="middle">{m}</text>)}
      </svg>
    </div>
    <div className="section-label">Indicadores</div>
    {[['Índice de placa','Bajo','82%','Excelente higiene'],['Uso diario del alineador','22.4h','93%','Objetivo cumplido']].map(([l,v,b,n])=>
      <div key={l} className="card">
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
          <span style={{fontSize:13,fontWeight:700}}>{l}</span>
          <span style={{fontSize:12,color:'#7A5A85',fontWeight:700}}>{n}</span>
        </div>
        <div style={{fontFamily:"'Libre Caslon Text',serif",fontSize:21,color:C,marginBottom:10}}>{v}</div>
        <div style={{height:8,background:'#EFEAF0',borderRadius:4,overflow:'hidden'}}><div style={{width:b,height:'100%',background:'linear-gradient(90deg,#3D2645,#C98B8B)',borderRadius:4}}/></div>
      </div>)}
    <div className="note-card" style={{marginBottom:24}}>
      <div className="note-label">Valoración clínica</div>
      <div className="note-text">El apiñamiento inferior se ha corregido casi por completo. Las fotos de progreso muestran una evolución muy favorable de la línea de sonrisa.</div>
    </div>
  </div>;
}

function Bookings(){
  const [step,setStep]=useState(0),[sel,setSel]=useState({}),[done,setDone]=useState(false);
  const docs=[['Dr. Bratos','Ortodoncia'],['Dr. Ferrus','Implantología'],['Dra. Alba Santos','Odontología estética'],['Dra. Inés Coto','Periodoncia']];
  const svcs=[['Revisión de ortodoncia','Incluida'],['Higiene bucodental','65€'],['Blanqueamiento LED','295€'],['Estudio de implantes','Gratuito']];
  const times=['9:00','9:30','10:30','11:00','12:00','12:30','16:00','16:30','17:30','18:00'];
  const unav=['9:30','12:00','16:30'];
  if(done)return <div>
    <div className="screen-title-bar"><div className="screen-title">Citas</div></div>
    <div className="success-card">
      <div style={{fontSize:44,marginBottom:10}}>✓</div>
      <div style={{fontFamily:"'Libre Caslon Text',serif",fontSize:21,marginBottom:6}}>Cita confirmada</div>
      <div style={{fontSize:13,opacity:0.8}}>{sel.doc} · {sel.svc}</div>
      <div style={{fontSize:13,opacity:0.8,marginTop:3}}>Velázquez 58 · {sel.time}</div>
    </div>
    <div className="confirm-btn" onClick={()=>{setDone(false);setStep(0);setSel({})}}>Nueva cita</div>
  </div>;
  return <div>
    <div className="screen-title-bar">
      <div className="screen-title">Citas</div>
      <div style={{display:'flex',gap:6,marginTop:12}}>
        {['Doctor','Servicio','Hora'].map((s,i)=><div key={s} style={{flex:1,height:3,borderRadius:2,background:i<=step?C:'#E5DEE8'}}/>)}
      </div>
    </div>
    {step===0&&<><div className="section-label">Selecciona doctor</div>
      {docs.map(([n,r])=><div key={n} className="option-card" onClick={()=>{setSel({...sel,doc:n});setStep(1)}}>
        <div className="item-ico">🦷</div><div><div className="item-name">{n}</div><div className="item-sub">{r}</div></div></div>)}</>}
    {step===1&&<><div className="section-label">Selecciona servicio</div>
      {svcs.map(([n,p])=><div key={n} className="option-card" onClick={()=>{setSel({...sel,svc:n});setStep(2)}}>
        <div style={{flex:1}}><div className="item-name">{n}</div></div><div style={{fontWeight:700,color:C,fontSize:13}}>{p}</div></div>)}</>}
    {step===2&&<><div className="section-label">Hora · Miércoles 9 julio</div>
      <div className="time-grid">{times.map(t=><div key={t} className={`time-chip${unav.includes(t)?' unavailable':sel.time===t?' selected':''}`} onClick={()=>!unav.includes(t)&&setSel({...sel,time:t})}>{t}</div>)}</div>
      {sel.time&&<div className="confirm-btn" onClick={()=>setDone(true)}>Confirmar cita</div>}</>}
  </div>;
}

function Messages(){
  const msgs=[
    ['pro','Dr. Bratos','Hola Marta, he revisado el escaneado. El alineador 14 ajusta perfectamente, puedes seguir con el calendario previsto.','Hace 2 días'],
    ['user',null,'Genial. ¿Sigo usando los chewies con cada cambio?','Hace 2 días'],
    ['pro','Dr. Bratos','Sí, 10 minutos mañana y noche los tres primeros días de cada alineador. Es clave para el asentamiento.','Hace 2 días'],
    ['pro','Recepción','Le recordamos su cita del miércoles 9 a las 12:00h con el Dr. Bratos. Responda CONFIRMAR para validarla.','Ayer'],
    ['user',null,'Confirmar. ¡Gracias!','Ayer'],
  ];
  return <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
    <div className="screen-title-bar" style={{flexShrink:0}}><div className="screen-title">Mensajes</div><div className="screen-sub">Ferrus & Bratos · Velázquez 58</div></div>
    <div style={{flex:1,overflowY:'auto',padding:'12px 0'}}>
      {msgs.map(([from,name,text,time],i)=><div key={i}>
        {from==='pro'&&<div className="msg-sender">{name}</div>}
        <div className={`msg-bubble ${from}`}>{text}</div>
        <div className={`msg-time${from==='user'?' right':''}`}>{time}</div>
      </div>)}
    </div>
    <div className="msg-input-row">
      <input className="msg-input" placeholder="Escribe un mensaje…" readOnly/>
      <div className="msg-send"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></div>
    </div>
  </div>;
}

function App(){
  const [tab,setTab]=useState(0);
  const screens=[Home,Plan,Progress,Bookings,Messages];
  const S=screens[tab];
  const tabs=[['Inicio',Icons.home],['Plan',Icons.plan],['Progreso',Icons.prog],['Citas',Icons.book],['Mensajes',Icons.msg]];
  return <div className="phone">
    <div className="status-bar"><span>9:41</span>
      <div style={{display:'flex',gap:6,alignItems:'center'}}>
        <svg width="16" height="12" viewBox="0 0 16 12"><rect x="0" y="3" width="3" height="9" rx="1" fill="white" opacity="0.4"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="white" opacity="0.6"/><rect x="9" y="0.5" width="3" height="11.5" rx="1" fill="white" opacity="0.8"/><rect x="13.5" y="0" width="2.5" height="12" rx="1" fill="white"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="1" width="22" height="10" rx="2" stroke="white" strokeWidth="1" fill="none" opacity="0.5"/><rect x="23" y="3.5" width="2" height="5" rx="1" fill="white" opacity="0.5"/><rect x="1.5" y="2.5" width="16" height="7" rx="1" fill="white"/></svg>
      </div>
    </div>
    <div className="screen" key={tab}><S/></div>
    <div className="tab-bar">{tabs.map(([l,I],i)=><div key={i} className={`tab${tab===i?' active':''}`} onClick={()=>setTab(i)}>{I(tab===i)}<span>{l}</span></div>)}</div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
