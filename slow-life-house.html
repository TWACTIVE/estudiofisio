<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slow Life House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#EFEDE6;
  --moss:#5C6B48;
  --moss-dk:#414D31;
  --sand:#D8CDB6;
  --ink:#2C2C26;
  --muted:#7C7B6F;
  --surface:#FBFAF6;
  --border:#DEDACD;
}
body{background:#CFCBBD;font-family:'Karla',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.phone{width:390px;height:844px;background:var(--bg);border-radius:44px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 32px 80px rgba(0,0,0,0.28),0 0 0 1px rgba(0,0,0,0.08)}
.status-bar{background:var(--moss-dk);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 24px 10px;font-size:12px;font-weight:500;flex-shrink:0}
.screen{flex:1;overflow-y:auto;overflow-x:hidden}
.screen::-webkit-scrollbar{display:none}
.tab-bar{background:var(--surface);border-top:1px solid var(--border);display:flex;flex-shrink:0;padding-bottom:16px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 4px;cursor:pointer}
.tab span{font-size:10px;font-weight:500;letter-spacing:0.03em}
.tab.active{color:var(--moss-dk)}
.tab:not(.active){color:var(--muted)}
.tab-icon{width:22px;height:22px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.screen > *{animation:fadeUp 0.3s ease forwards}
.app-header{background:var(--moss-dk);padding:22px 24px 28px;color:#F5F3EA}
.wordmark{font-family:'Marcellus',serif;font-size:19px;letter-spacing:0.06em;text-transform:uppercase}
.wordmark em{font-style:normal;opacity:0.6;font-size:11px;display:block;margin-top:3px;letter-spacing:0.14em}
.greeting{font-size:13px;font-weight:300;opacity:0.7;margin-top:18px}
.patient-name{font-family:'Marcellus',serif;font-size:23px;margin-top:3px;letter-spacing:0.02em}
.screen-title-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:20px 20px 16px}
.screen-title{font-family:'Marcellus',serif;font-size:21px;color:var(--moss-dk);letter-spacing:0.03em}
.screen-sub{font-size:13px;color:var(--muted);margin-top:4px}
.section-label{font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);padding:20px 20px 8px}
.card{background:var(--surface);border-radius:18px;padding:18px;margin:0 16px 12px;box-shadow:0 1px 6px rgba(65,77,49,0.08)}
.appt-card{background:var(--moss);color:#F5F3EA;border-radius:18px;padding:18px;margin:16px 16px 12px}
.badge{background:var(--sand);color:var(--moss-dk);border-radius:20px;padding:4px 11px;font-size:11px;font-weight:700;float:right}
.item-ico{width:38px;height:38px;border-radius:12px;background:#EBE7DA;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.item-name{font-size:14px;font-weight:700;color:var(--ink)}
.item-sub{font-size:12px;color:var(--muted);margin-top:2px}
.chev{color:var(--muted);transition:transform 0.2s}
.chev.open{transform:rotate(180deg)}
.expand-body{background:#F1EFE6;padding:13px 16px;font-size:13px;color:var(--muted);line-height:1.6;border-top:1px solid var(--border)}
.chart-label{font-size:10px;fill:var(--muted);font-family:'Karla',sans-serif}
.note-card{background:#E9E6D8;border-left:3px solid var(--moss);border-radius:18px;padding:16px;margin:0 16px 12px}
.note-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--moss-dk);margin-bottom:6px}
.note-text{font-size:13px;color:var(--ink);line-height:1.6}
.option-card{background:var(--surface);border-radius:14px;padding:14px 16px;margin:0 16px 8px;display:flex;align-items:center;gap:12px;cursor:pointer;border:1.5px solid var(--border)}
.time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 16px 16px}
.time-chip{background:var(--surface);border-radius:10px;padding:10px 6px;text-align:center;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);color:var(--ink)}
.time-chip.selected{background:var(--moss-dk);color:#fff;border-color:var(--moss-dk)}
.time-chip.unavailable{background:#E7E4D8;color:#B8B5A4;cursor:default}
.confirm-btn{background:var(--moss-dk);color:#fff;border-radius:50px;padding:16px;text-align:center;font-size:14px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;margin:8px 16px 20px;cursor:pointer}
.success-card{background:linear-gradient(135deg,var(--moss-dk),var(--moss));color:#F5F3EA;border-radius:18px;padding:28px;margin:20px 16px;text-align:center}
.msg-bubble{max-width:78%;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.55;margin:4px 16px}
.msg-bubble.pro{background:var(--surface);color:var(--ink);border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(65,77,49,0.08)}
.msg-bubble.user{background:var(--moss);color:#F5F3EA;border-bottom-right-radius:4px;margin-left:auto}
.msg-time{font-size:10px;color:var(--muted);margin:2px 16px 10px}
.msg-time.right{text-align:right}
.msg-sender{font-size:11px;font-weight:700;color:var(--moss-dk);margin:12px 16px 4px;letter-spacing:0.04em}
.msg-input-row{background:var(--surface);border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;align-items:center;flex-shrink:0}
.msg-input{flex:1;background:var(--bg);border-radius:22px;padding:10px 16px;font-size:13px;font-family:'Karla',sans-serif;border:none;outline:none;color:var(--ink)}
.msg-send{width:38px;height:38px;border-radius:50%;background:var(--moss-dk);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.ritual-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const C="#414D31",M="#7C7B6F";
const Icons={
  home:a=><svg viewBox="0 0 24 24" fill={a?C:"none"} stroke={a?C:M} strokeWidth="1.8" className="tab-icon"><path d="M3 9.5L12 3l9 6.5V21H3V9.5z" strokeLinejoin="round"/></svg>,
  plan:a=><svg viewBox="0 0 24 24" fill="none" stroke={a?C:M} strokeWidth="1.8" className="tab-icon"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4" strokeLinecap="round"/></svg>,
  prog:a=><svg viewBox="0 0 24 24" fill="none" stroke={a?C:M} strokeWidth="1.8" className="tab-icon"><path d="M3 17l5-5 4 4 9-9" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  book:a=><svg viewBox="0 0 24 24" fill="none" stroke={a?C:M} strokeWidth="1.8" className="tab-icon"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18" strokeLinecap="round"/></svg>,
  msg:a=><svg viewBox="0 0 24 24" fill="none" stroke={a?C:M} strokeWidth="1.8" className="tab-icon"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z" strokeLinejoin="round"/></svg>
};
const Chev=({open})=><svg viewBox="0 0 24 24" fill="none" stroke={M} strokeWidth="2" width="18" height="18" className={`chev${open?' open':''}`}><path d="M6 9l6 6 6-6"/></svg>;

function Home(){
  return <div>
    <div className="app-header">
      <div className="wordmark">Slow Life House<em>Wellness integral · Barrio de Salamanca</em></div>
      <div className="greeting">Bienvenida de nuevo,</div>
      <div className="patient-name">Claudia Ferrán</div>
    </div>
    <div className="appt-card">
      <div className="badge">Confirmada</div>
      <div style={{fontSize:11,opacity:0.7,textTransform:'uppercase',letterSpacing:'0.1em'}}>Próximo ritual</div>
      <div style={{fontFamily:"'Marcellus',serif",fontSize:20,marginTop:5}}>Sábado, 12 julio</div>
      <div style={{fontSize:13,opacity:0.85,marginTop:3}}>Baño subacuático + masaje drenante · 10:30h · con Alma</div>
    </div>
    <div className="section-label">Tu programa Slow</div>
    <div className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
        <span style={{fontFamily:"'Marcellus',serif",fontSize:17,color:C}}>Programa Detox · 12 semanas</span>
        <span style={{fontSize:12,color:M}}>Semana 7</span>
      </div>
      <div style={{height:8,background:'#E7E4D8',borderRadius:4,overflow:'hidden',marginTop:12}}>
        <div style={{width:'58%',height:'100%',background:'linear-gradient(90deg,#5C6B48,#D8CDB6)',borderRadius:4}}/>
      </div>
      <div style={{display:'flex',gap:8,marginTop:14}}>
        {[['Nutrición','✓'],['Fisio','✓'],['Estética','·'],['Masaje','·']].map(([l,s])=>
          <div key={l} style={{flex:1,textAlign:'center'}}>
            <div className="ritual-dot" style={{margin:'0 auto',background:s==='✓'?'#5C6B48':'#E7E4D8',color:s==='✓'?'#fff':M}}>{s}</div>
            <div style={{fontSize:10,color:M,marginTop:5}}>{l}</div>
          </div>)}
      </div>
      <div style={{fontSize:11,color:M,marginTop:10,textAlign:'center'}}>Sesiones de esta semana</div>
    </div>
    <div className="section-label">Rituales de hoy</div>
    <div className="card" style={{marginBottom:24}}>
      {[['🍵','Infusión drenante en ayunas','Completado'],['🚶','Paseo consciente · 40 min','Pendiente'],['🧖','Automasaje con cepillo seco','Pendiente']].map(([i,t,s])=>
        <div key={t} style={{display:'flex',alignItems:'center',gap:12,padding:'11px 0',borderBottom:'1px solid var(--border)'}}>
          <span style={{fontSize:18}}>{i}</span>
          <span style={{flex:1,fontSize:13,fontWeight:600,color:'var(--ink)'}}>{t}</span>
          <span style={{fontSize:11,fontWeight:700,color:s==='Completado'?'#5C6B48':M}}>{s}</span>
        </div>)}
    </div>
  </div>;
}

function Plan(){
  const [open,setOpen]=useState(null);
  const items=[
    ['🥬','Pauta nutricional antiinflamatoria','Diseñada por Nutrición','Base vegetal con proteína limpia. Sin ultraprocesados, azúcar refinada ni alcohol durante el programa. Hidratación: 2L de agua + infusiones.'],
    ['💆','Masaje drenante manual','1 sesión/semana','Drenaje linfático método Vodder, 50 minutos. Acudir sin cremas corporales y bien hidratada.'],
    ['🛁','Baño subacuático','Semanas 4, 8 y 12','La primera bañera de masaje subacuático de Madrid. Sesión de 30 minutos con presión programada por zonas.'],
    ['🧘','Movimiento consciente','3 sesiones/semana','Combinar las clases de movilidad del estudio con paseos de 40 minutos a ritmo suave. Descanso activo los domingos.'],
    ['🌙','Higiene del sueño','Ritual nocturno diario','Sin pantallas 1 hora antes de dormir. Infusión de pasiflora, luz cálida y 10 minutos de respiración 4-7-8.'],
  ];
  return <div>
    <div className="screen-title-bar"><div className="screen-title">Tu programa</div><div className="screen-sub">Detox integral · Equipo Slow Life</div></div>
    <div style={{height:12}}/>
    {items.map(([ico,name,freq,det],i)=>
      <div key={i} style={{background:'var(--surface)',borderRadius:18,margin:'0 16px 10px',overflow:'hidden',boxShadow:'0 1px 6px rgba(65,77,49,0.08)'}}>
        <div style={{display:'flex',alignItems:'center',gap:12,padding:'14px 18px',cursor:'pointer'}} onClick={()=>setOpen(open===i?null:i)}>
          <div className="item-ico">{ico}</div>
          <div style={{flex:1}}><div className="item-name">{name}</div><div className="item-sub">{freq}</div></div>
          <Chev open={open===i}/>
        </div>
        {open===i&&<div className="expand-body">{det}</div>}
      </div>)}
    <div className="note-card" style={{marginBottom:24}}>
      <div className="note-label">Nota de tu coach</div>
      <div className="note-text">Semana 7: el descanso ha mejorado mucho y la retención de líquidos casi ha desaparecido. Esta fase toca profundizar en la parte de estética corporal.</div>
      <div style={{fontSize:11,color:M,marginTop:8}}>— Alma, coordinadora de programa</div>
    </div>
  </div>;
}

function Progress(){
  const energy=[4,5,5,6,7,7,8,8];
  const sleep=[5,5,6,6,7,8,8,9];
  const p=(a)=>a.map((v,i)=>`${32+i*40},${90-(v/10)*72}`).join(' ');
  return <div>
    <div className="screen-title-bar"><div className="screen-title">Tu evolución</div><div className="screen-sub">Programa Detox · 8 semanas</div></div>
    <div className="section-label">Energía y descanso</div>
    <div className="card">
      <div style={{display:'flex',gap:14,marginBottom:12}}>
        <div style={{display:'flex',alignItems:'center',gap:5,fontSize:11,color:M}}><div style={{width:12,height:2.5,background:'#5C6B48'}}/> Energía</div>
        <div style={{display:'flex',alignItems:'center',gap:5,fontSize:11,color:M}}><div style={{width:12,height:2.5,background:'#B0A385'}}/> Sueño</div>
      </div>
      <svg viewBox="0 0 332 100" style={{width:'100%',height:100,display:'block'}}>
        {[2,5,8].map(v=><g key={v}><line x1="32" y1={90-(v/10)*72} x2="312" y2={90-(v/10)*72} stroke="#E7E4D8"/><text x="10" y={93-(v/10)*72} className="chart-label">{v}</text></g>)}
        <polyline points={p(energy)} fill="none" stroke="#5C6B48" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
        <polyline points={p(sleep)} fill="none" stroke="#B0A385" strokeWidth="2" strokeDasharray="4,3" strokeLinecap="round" strokeLinejoin="round"/>
        {energy.map((v,i)=><circle key={i} cx={32+i*40} cy={90-(v/10)*72} r={i===7?4:2.5} fill="#5C6B48"/>)}
        {['S1','S2','S3','S4','S5','S6','S7','S8'].map((m,i)=><text key={m} x={32+i*40} y="100" className="chart-label" textAnchor="middle">{m}</text>)}
      </svg>
    </div>
    <div className="section-label">Mediciones</div>
    {[['Retención de líquidos','Mínima','85%'],['Adherencia nutricional','92%','92%'],['Calidad de sueño','9 / 10','90%']].map(([l,v,b])=>
      <div key={l} className="card">
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
          <span style={{fontSize:13,fontWeight:700}}>{l}</span>
          <span style={{fontFamily:"'Marcellus',serif",fontSize:17,color:C}}>{v}</span>
        </div>
        <div style={{height:8,background:'#E7E4D8',borderRadius:4,overflow:'hidden'}}><div style={{width:b,height:'100%',background:'linear-gradient(90deg,#5C6B48,#D8CDB6)',borderRadius:4}}/></div>
      </div>)}
    <div style={{height:24}}/>
  </div>;
}

function Bookings(){
  const [step,setStep]=useState(0),[sel,setSel]=useState({}),[done,setDone]=useState(false);
  const pros=[['Alma','Coordinación y coaching'],['Irene Salas','Nutrición'],['Marta Duque','Fisioterapia y drenaje'],['Paula Vela','Estética integral']];
  const svcs=[['Masaje drenante · 50 min','95€'],['Baño subacuático · 30 min','120€'],['Consulta de nutrición','80€'],['Ritual manos y pies Slow Room','65€']];
  const times=['10:00','10:30','11:30','12:00','13:00','16:00','16:30','17:30','18:00','19:00'];
  const unav=['10:30','13:00','17:30'];
  if(done)return <div>
    <div className="screen-title-bar"><div className="screen-title">Reservas</div></div>
    <div className="success-card">
      <div style={{fontSize:44,marginBottom:10}}>✻</div>
      <div style={{fontFamily:"'Marcellus',serif",fontSize:21,marginBottom:6}}>Ritual reservado</div>
      <div style={{fontSize:13,opacity:0.85}}>{sel.pro} · {sel.svc}</div>
      <div style={{fontSize:13,opacity:0.85,marginTop:3}}>{sel.time}</div>
    </div>
    <div className="confirm-btn" onClick={()=>{setDone(false);setStep(0);setSel({})}}>Nueva reserva</div>
  </div>;
  return <div>
    <div className="screen-title-bar">
      <div className="screen-title">Reservas</div>
      <div style={{display:'flex',gap:6,marginTop:12}}>
        {['Especialista','Ritual','Hora'].map((s,i)=><div key={s} style={{flex:1,height:3,borderRadius:2,background:i<=step?C:'#DEDACD'}}/>)}
      </div>
    </div>
    {step===0&&<><div className="section-label">Con quién</div>
      {pros.map(([n,r])=><div key={n} className="option-card" onClick={()=>{setSel({...sel,pro:n});setStep(1)}}>
        <div className="item-ico">🌿</div><div><div className="item-name">{n}</div><div className="item-sub">{r}</div></div></div>)}</>}
    {step===1&&<><div className="section-label">Elige tu ritual</div>
      {svcs.map(([n,p2])=><div key={n} className="option-card" onClick={()=>{setSel({...sel,svc:n});setStep(2)}}>
        <div style={{flex:1}}><div className="item-name">{n}</div></div><div style={{fontWeight:700,color:C,fontSize:13}}>{p2}</div></div>)}</>}
    {step===2&&<><div className="section-label">Hora · Sábado 12 julio</div>
      <div className="time-grid">{times.map(t=><div key={t} className={`time-chip${unav.includes(t)?' unavailable':sel.time===t?' selected':''}`} onClick={()=>!unav.includes(t)&&setSel({...sel,time:t})}>{t}</div>)}</div>
      {sel.time&&<div className="confirm-btn" onClick={()=>setDone(true)}>Reservar</div>}</>}
  </div>;
}

function Messages(){
  const msgs=[
    ['pro','Alma','Claudia, ¿qué tal la semana? Vi que completaste todas las sesiones de movimiento. 🌿','Hace 2 días'],
    ['user',null,'¡Muy bien! Duermo mejor que nunca. El sábado pruebo por fin la bañera subacuática, ¿no?','Hace 2 días'],
    ['pro','Alma','Sí. Ven sin cremas corporales, con bañador cómodo, y llega 10 minutos antes para la infusión de bienvenida.','Hace 2 días'],
    ['pro','Irene Salas','Te he subido la pauta nutricional de la fase 3 al apartado de programa. Introduce el caldo depurativo esta semana.','Ayer'],
    ['user',null,'Visto, ¡gracias Irene!','Hoy'],
  ];
  return <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
    <div className="screen-title-bar" style={{flexShrink:0}}><div className="screen-title">Mensajes</div><div className="screen-sub">Tu equipo Slow Life</div></div>
    <div style={{flex:1,overflowY:'auto',padding:'12px 0'}}>
      {msgs.map(([from,name,text,time],i)=><div key={i}>
        {from==='pro'&&<div className="msg-sender">{name}</div>}
        <div className={`msg-bubble ${from}`}>{text}</div>
        <div className={`msg-time${from==='user'?' right':''}`}>{time}</div>
      </div>)}
    </div>
    <div className="msg-input-row">
      <input className="msg-input" placeholder="Escribe un mensaje…" readOnly/>
      <div className="msg-send"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></div>
    </div>
  </div>;
}

function App(){
  const [tab,setTab]=useState(0);
  const screens=[Home,Plan,Progress,Bookings,Messages];
  const S=screens[tab];
  const tabs=[['Inicio',Icons.home],['Programa',Icons.plan],['Evolución',Icons.prog],['Reservas',Icons.book],['Mensajes',Icons.msg]];
  return <div className="phone">
    <div className="status-bar"><span>9:41</span>
      <div style={{display:'flex',gap:6,alignItems:'center'}}>
        <svg width="16" height="12" viewBox="0 0 16 12"><rect x="0" y="3" width="3" height="9" rx="1" fill="white" opacity="0.4"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="white" opacity="0.6"/><rect x="9" y="0.5" width="3" height="11.5" rx="1" fill="white" opacity="0.8"/><rect x="13.5" y="0" width="2.5" height="12" rx="1" fill="white"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="1" width="22" height="10" rx="2" stroke="white" strokeWidth="1" fill="none" opacity="0.5"/><rect x="23" y="3.5" width="2" height="5" rx="1" fill="white" opacity="0.5"/><rect x="1.5" y="2.5" width="16" height="7" rx="1" fill="white"/></svg>
      </div>
    </div>
    <div className="screen" key={tab}><S/></div>
    <div className="tab-bar">{tabs.map(([l,I],i)=><div key={i} className={`tab${tab===i?' active':''}`} onClick={()=>setTab(i)}>{I(tab===i)}<span>{l}</span></div>)}</div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
