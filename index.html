<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>EstudioFisio — App</title>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #FAF8F5;
      --cream-dark: #F2EDE6;
      --sage: #5C6F5C;
      --sage-light: #7A8F7A;
      --sage-pale: #EAF0EA;
      --charcoal: #2B2B2B;
      --charcoal-mid: #555555;
      --charcoal-soft: #888888;
      --gold: #C9966B;
      --gold-pale: #F5EBE1;
      --white: #FFFFFF;
      --border: #E8E3DC;
      --shadow: 0 2px 16px rgba(43,43,43,0.07);
      --shadow-sm: 0 1px 6px rgba(43,43,43,0.06);
      --radius: 16px;
      --radius-sm: 10px;
      --radius-xs: 6px;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Playfair Display', Georgia, serif;
    }

    html, body {
      height: 100%;
      background: #E8E3DC;
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    #root {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 0;
    }

    @media (min-width: 480px) {
      #root {
        padding: 24px 0;
        background: #D8D3CB;
      }
    }

    .phone-shell {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: var(--cream);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 480px) {
      .phone-shell {
        min-height: calc(100vh - 48px);
        max-height: 900px;
        border-radius: 40px;
        box-shadow: 0 24px 80px rgba(0,0,0,0.22), 0 4px 16px rgba(0,0,0,0.12);
      }
    }

    /* Status bar */
    .status-bar {
      background: var(--cream);
      padding: 12px 24px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .status-bar-time {
      font-size: 15px;
      font-weight: 600;
      color: var(--charcoal);
      letter-spacing: -0.3px;
    }

    .status-bar-icons {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* Scrollable content area */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .screen-content::-webkit-scrollbar { display: none; }

    /* Tab bar */
    .tab-bar {
      background: var(--white);
      border-top: 1px solid var(--border);
      display: flex;
      padding: 8px 0 20px;
      flex-shrink: 0;
    }

    @media (min-width: 480px) {
      .tab-bar { padding-bottom: 8px; }
    }

    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 4px;
      cursor: pointer;
      border: none;
      background: none;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .tab-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tab-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2px;
      transition: color 0.2s;
    }

    .tab-item.active .tab-label { color: var(--sage); }
    .tab-item:not(.active) .tab-label { color: var(--charcoal-soft); }

    /* Screen header */
    .screen-header {
      padding: 16px 24px 0;
    }

    .wordmark {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 500;
      color: var(--sage);
      letter-spacing: 0.5px;
    }

    .wordmark span { color: var(--gold); }

    /* Cards */
    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }

    .card-inner {
      padding: 18px 20px;
    }

    /* Section labels */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--charcoal-soft);
      margin-bottom: 12px;
    }

    /* Buttons */
    .btn-primary {
      background: var(--sage);
      color: var(--white);
      border: none;
      border-radius: 50px;
      padding: 12px 24px;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-primary:active { transform: scale(0.97); background: #4a5c4a; }

    .btn-outline {
      background: transparent;
      color: var(--sage);
      border: 1.5px solid var(--sage);
      border-radius: 50px;
      padding: 10px 20px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-outline:active { background: var(--sage-pale); }

    .btn-ghost {
      background: var(--gold-pale);
      color: var(--gold);
      border: none;
      border-radius: 50px;
      padding: 8px 16px;
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 0.2px;
    }

    /* Avatar */
    .avatar {
      border-radius: 50%;
      background: var(--sage-pale);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-family: var(--font-display);
      font-weight: 600;
      color: var(--sage);
    }

    /* Progress bar */
    .progress-track {
      height: 6px;
      background: var(--cream-dark);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--sage);
      border-radius: 99px;
      transition: width 0.6s ease;
    }

    /* Slider */
    .slider-container { position: relative; }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 99px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"].pain-slider {
      background: linear-gradient(to right, var(--sage) 0%, var(--sage) var(--pct, 50%), var(--cream-dark) var(--pct, 50%), var(--cream-dark) 100%);
    }

    input[type="range"].mobility-slider {
      background: linear-gradient(to right, var(--gold) 0%, var(--gold) var(--pct, 70%), var(--cream-dark) var(--pct, 70%), var(--cream-dark) 100%);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--white);
      border: 2px solid;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      cursor: pointer;
    }

    input[type="range"].pain-slider::-webkit-slider-thumb { border-color: var(--sage); }
    input[type="range"].mobility-slider::-webkit-slider-thumb { border-color: var(--gold); }

    /* Chart */
    .chart-container {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    /* Tags/chips */
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .chip-sage { background: var(--sage-pale); color: var(--sage); }
    .chip-gold { background: var(--gold-pale); color: #A87348; }

    /* Exercise card */
    .exercise-card {
      background: var(--white);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      overflow: hidden;
      transition: box-shadow 0.2s;
    }

    .exercise-card:active { box-shadow: var(--shadow); }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 0 20px;
    }

    /* Message bubble */
    .message-note {
      background: var(--white);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      padding: 16px;
    }

    .message-note-date {
      font-size: 11px;
      color: var(--charcoal-soft);
      font-weight: 500;
      margin-bottom: 6px;
    }

    .message-note-from {
      font-size: 12px;
      font-weight: 600;
      color: var(--sage);
      margin-bottom: 6px;
    }

    .message-note-text {
      font-size: 14px;
      color: var(--charcoal);
      line-height: 1.55;
    }

    /* Input */
    .message-input-wrap {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 50px;
      display: flex;
      align-items: center;
      padding: 10px 16px;
      gap: 10px;
    }

    .message-input-wrap input {
      flex: 1;
      border: none;
      outline: none;
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--charcoal);
      background: transparent;
    }

    .message-input-wrap input::placeholder { color: var(--charcoal-soft); }

    /* Location cards */
    .location-card {
      background: var(--white);
      border-radius: var(--radius-sm);
      border: 2px solid var(--border);
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .location-card.selected {
      border-color: var(--sage);
      background: var(--sage-pale);
    }

    /* Time slots */
    .time-slot {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-xs);
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 500;
      color: var(--charcoal);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .time-slot.selected {
      background: var(--sage);
      border-color: var(--sage);
      color: var(--white);
    }

    .time-slot.unavailable {
      opacity: 0.35;
      cursor: default;
    }

    /* SVG icons inline */
    svg { display: block; }

    /* Animation */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-up { animation: fadeUp 0.3s ease forwards; }

    /* Notification dot */
    .notif-dot {
      width: 7px;
      height: 7px;
      background: var(--gold);
      border-radius: 50%;
      position: absolute;
      top: 0;
      right: -1px;
    }
  </style>
</head>

/* ─── Simple Line Chart ─── */
const MiniChart = ({ data, dataKey, color }) => {
  const width = 320;
  const height = 90;
  const pad = { top: 10, right: 10, bottom: 24, left: 10 };
  const innerW = width - pad.left - pad.right;
  const innerH = height - pad.top - pad.bottom;
  const vals = data.map(d => d[dataKey]);
  const minV = 0;
  const maxV = 10;
  const xStep = innerW / (data.length - 1);
  const yScale = v => pad.top + innerH - ((v - minV) / (maxV - minV)) * innerH;
  const xScale = i => pad.left + i * xStep;
  const points = data.map((d, i) => `${xScale(i)},${yScale(d[dataKey])}`).join(" ");
  const fillPoints = [
    `${xScale(0)},${pad.top + innerH}`,
    ...data.map((d, i) => `${xScale(i)},${yScale(d[dataKey])}`),
    `${xScale(data.length - 1)},${pad.top + innerH}`,
  ].join(" ");
  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", height: "auto" }}>
      <defs>
        <linearGradient id={`grad-${dataKey}`} x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.18" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      {/* Grid lines */}
      {[2.5, 5, 7.5].map(v => (
        <line key={v} x1={pad.left} x2={width - pad.right} y1={yScale(v)} y2={yScale(v)}
          stroke="#E8E3DC" strokeWidth="1" />
      ))}
      {/* Area fill */}
      <polygon points={fillPoints} fill={`url(#grad-${dataKey})`} />
      {/* Line */}
      <polyline points={points} fill="none" stroke={color} strokeWidth="2.2"
        strokeLinejoin="round" strokeLinecap="round" />
      {/* Dots */}
      {data.map((d, i) => (
        <circle key={i} cx={xScale(i)} cy={yScale(d[dataKey])} r="3.5"
          fill="white" stroke={color} strokeWidth="2" />
      ))}
      {/* X labels */}
      {data.map((d, i) => (
        <text key={i} x={xScale(i)} y={height - 4} textAnchor="middle"
          fontSize="9" fill="#888888" fontFamily="Inter, sans-serif" fontWeight="500">
          {d.week}
        </text>
      ))}
    </svg>
  );
};

              </div>
              {selectedLocation === loc.id && (
                <div style={{ width: 22, height: 22, borderRadius: "50%", background: "var(--sage)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                  <Icon name="check" size={12} color="white" />
                </div>
              )}
            </div>
          </button>
        ))}
      </div>

      {/* Step 2: Physio */}
      {selectedLocation && (
        <>
          <p className="section-label">2. Elige fisioterapeuta</p>
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 22 }}>
            {physios.map(p => (
              <button key={p.name} onClick={() => setSelectedPhysio(p.name)}
                style={{ background: "var(--white)", border: `1.5px solid ${selectedPhysio === p.name ? "var(--sage)" : "var(--border)"}`, borderRadius: 10, padding: "12px 14px", display: "flex", alignItems: "center", gap: 12, cursor: "pointer", textAlign: "left", transition: "border-color 0.15s" }}>
                <div className="avatar" style={{ width: 38, height: 38, fontSize: 13, background: selectedPhysio === p.name ? "var(--sage)" : "var(--sage-pale)", color: selectedPhysio === p.name ? "white" : "var(--sage)" }}>
                  {p.initials}
                </div>
                <div style={{ flex: 1 }}>
                  <p style={{ fontSize: 13, fontWeight: 600, color: "var(--charcoal)", marginBottom: 3 }}>{p.name}</p>
                  <span className="chip chip-sage" style={{ fontSize: 10, padding: "3px 8px" }}>{p.specialty}</span>
                </div>
                <p style={{ fontSize: 11, color: "var(--charcoal-soft)" }}>Colegiado/a</p>
              </button>
            ))}
          </div>
        </>
      )}

      {/* Step 3: Date */}
      {selectedPhysio && (
        <>
          <p className="section-label">3. Elige fecha</p>
          <div style={{ display: "flex", gap: 8, marginBottom: 22, overflowX: "auto", paddingBottom: 4 }}>
            {dates.map(d => (
              <button key={d.num} onClick={() => { setSelectedDate(d.num); setSelectedSlot(null); }}
                style={{ flexShrink: 0, width: 58, padding: "10px 6px", borderRadius: 10, border: `1.5px solid ${selectedDate === d.num ? "var(--sage)" : "var(--border)"}`, background: selectedDate === d.num ? "var(--sage)" : "var(--white)", cursor: "pointer", textAlign: "center", transition: "all 0.15s" }}>
                <p style={{ fontSize: 10, fontWeight: 500, color: selectedDate === d.num ? "rgba(255,255,255,0.75)" : "var(--charcoal-soft)", marginBottom: 4, textTransform: "uppercase" }}>{d.day}</p>
                <p style={{ fontFamily: "var(--font-display)", fontSize: 20, fontWeight: 500, color: selectedDate === d.num ? "white" : "var(--charcoal)", lineHeight: 1 }}>{d.num}</p>
                <p style={{ fontSize: 9, color: selectedDate === d.num ? "rgba(255,255,255,0.7)" : "var(--charcoal-soft)", marginTop: 4 }}>{d.month}</p>
              </button>
            ))}
          </div>
        </>
      )}

      {/* Step 4: Time slots */}
      {selectedDate && (
        <>
          <p className="section-label">4. Elige hora</p>
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 24 }}>
            {TIME_SLOTS.map((row, ri) => (
              <div key={ri} style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 8 }}>
                {row.map((slot, si) => (
                  <div key={si}
                    className={`time-slot${slot === "—" ? " unavailable" : ""}${selectedSlot === slot ? " selected" : ""}`}
                    onClick={() => slot !== "—" && setSelectedSlot(slot)}>
                    {slot}
                  </div>
                ))}
              </div>
            ))}
          </div>

          {selectedSlot && (
            <button className="btn-primary" style={{ width: "100%", padding: "14px", fontSize: 15 }}
              onClick={() => setBooked(true)}>
              Confirmar reserva · {selectedSlot} h
            </button>
          )}
        </>
      )}
    </div>
  );
};

/* ─── Screen: Messages ─── */
const MessagesScreen = () => {
  const [message, setMessage] = useState("");
  const [sent, setSent] = useState(false);
  const handleSend = () => {
    if (message.trim()) {
      setSent(true);
      setMessage("");
      setTimeout(() => setSent(false), 3000);
    }
  };
  return (
    <div className="fade-up" style={{ padding: "0 20px 32px", display: "flex", flexDirection: "column" }}>
      <div style={{ paddingTop: 8, paddingBottom: 20 }}>
        <p style={{ fontSize: 12, color: "var(--charcoal-soft)", fontWeight: 500, marginBottom: 3 }}>Comunicación</p>
        <h2 style={{ fontFamily: "var(--font-display)", fontSize: 22, fontWeight: 500, color: "var(--charcoal)" }}>
          Notas de sesión
        </h2>
      </div>

      {sent && (
        <div style={{ background: "var(--sage-pale)", borderRadius: 10, padding: "12px 16px", marginBottom: 16, display: "flex", gap: 10, alignItems: "center" }}>
          <Icon name="check" size={16} color="var(--sage)" />
          <p style={{ fontSize: 13, color: "var(--sage)", fontWeight: 500 }}>Mensaje enviado a María López.</p>
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {MESSAGES.map((msg, i) => (
          <div key={i} className="message-note">
            <p className="message-note-date">{msg.date}</p>
            <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 10 }}>
              <div className="avatar" style={{ width: 28, height: 28, fontSize: 10 }}>{msg.initials}</div>
              <p className="message-note-from">{msg.physio}</p>
            </div>
            <p className="message-note-text">{msg.text}</p>
          </div>
        ))}
      </div>

      {/* Message input */}
      <div style={{ marginTop: 24 }}>
        <p style={{ fontSize: 11, color: "var(--charcoal-soft)", fontWeight: 600, letterSpacing: "0.6px", textTransform: "uppercase", marginBottom: 10 }}>
          Enviar mensaje a tu fisio
        </p>
        <div className="message-input-wrap">
          <input
            type="text"
            placeholder="Escribe tu pregunta a María López..."
            value={message}
            onChange={e => setMessage(e.target.value)}
            onKeyDown={e => e.key === "Enter" && handleSend()}
          />
          <button onClick={handleSend} style={{ background: "none", border: "none", cursor: "pointer", padding: 0, color: message ? "var(--sage)" : "var(--charcoal-soft)", transition: "color 0.15s" }}>
            <Icon name="send" size={18} color={message ? "var(--sage)" : "var(--charcoal-soft)"} />
          </button>
        </div>
        <p style={{ fontSize: 11, color: "var(--charcoal-soft)", marginTop: 8, textAlign: "center" }}>
          Respuesta habitual en menos de 24 horas
        </p>
      </div>
    </div>
  );
};

/* ─── Status Bar Icons ─── */
const BatteryIcon = () => (
  <svg width="24" height="12" viewBox="0 0 24 12" fill="none">
    <rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="var(--charcoal)" strokeOpacity="0.4"/>
    <rect x="1.5" y="1.5" width="15" height="9" rx="1.5" fill="var(--charcoal)" fillOpacity="0.85"/>
    <path d="M22 4.5v3a1.5 1.5 0 000-3z" fill="var(--charcoal)" fillOpacity="0.4"/>
  </svg>
);

const WifiIcon = () => (
  <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
    <path d="M8 9a1 1 0 100 2 1 1 0 000-2z" fill="var(--charcoal)" fillOpacity="0.85"/>
    <path d="M5.17 6.17a4 4 0 015.66 0" stroke="var(--charcoal)" strokeOpacity="0.85" strokeWidth="1.5" strokeLinecap="round"/>
    <path d="M2.34 3.34a8 8 0 0111.32 0" stroke="var(--charcoal)" strokeOpacity="0.5" strokeWidth="1.5" strokeLinecap="round"/>
  </svg>
);

/* ─── App Shell ─── */
const App = () => {
  const [activeTab, setActiveTab] = useState("home");
  const contentRef = useRef(null);

  useEffect(() => {
    if (contentRef.current) contentRef.current.scrollTop = 0;
  }, [activeTab]);

  const screens = {
    home: <HomeScreen setTab={setActiveTab} />,
    plan: <PlanScreen />,
    progress: <ProgressScreen />,
    bookings: <BookingsScreen />,
    messages: <MessagesScreen />,
  };

  return (
    <div className="phone-shell">
      {/* Status bar */}
      <div className="status-bar">
        <span className="status-bar-time">9:41</span>
        <div className="status-bar-icons">
          <WifiIcon />
          <BatteryIcon />
        </div>
      </div>

      {/* Wordmark header */}
      <div className="screen-header">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", paddingBottom: 14, borderBottom: "1px solid var(--border)" }}>
          <span className="wordmark">estudio<span>fisio</span></span>
          <button style={{ background: "none", border: "none", cursor: "pointer", position: "relative" }}>
            <Icon name="bell" size={20} color="var(--charcoal-mid)" strokeWidth={1.6} />
            <span className="notif-dot" style={{ top: 1, right: 1 }} />
          </button>
        </div>
      </div>

      {/* Main content */}
      <div className="screen-content" ref={contentRef}>
        <div style={{ padding: "18px 0 0" }}>
          {screens[activeTab]}
        </div>
      </div>

      {/* Tab bar */}
      <TabBar active={activeTab} setActive={setActiveTab} />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
