<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Bienestar Psicología</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Mulish:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F4EFE8;
  --surface:#FDFAF6;
  --slate:#3D5470;
  --slate-mid:#506888;
  --slate-pale:#E4EBF2;
  --slate-faint:#EEF3F8;
  --rose:#B5808A;
  --rose-pale:#F5EAEC;
  --parch:#EDE5D8;
  --charcoal:#1E2830;
  --mid:#5A6A75;
  --soft:#9AAAB5;
  --border:#DDD5C8;
  --shadow:0 2px 14px rgba(61,84,112,0.08);
  --radius:16px;
  --font-body:'Mulish',system-ui,sans-serif;
  --font-display:'Crimson Pro',Georgia,serif;
}
html,body{height:100%;background:#B8B0A8;font-family:var(--font-body);-webkit-font-smoothing:antialiased}
#root{display:flex;justify-content:center;min-height:100vh}
@media(min-width:480px){#root{padding:24px 0;background:#ACA8A0}}
.shell{width:100%;max-width:430px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:480px){.shell{min-height:auto;max-height:900px;border-radius:38px;box-shadow:0 28px 80px rgba(61,84,112,0.2)}}
.sbar{background:var(--bg);padding:12px 24px 6px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.sbar-t{font-size:15px;font-weight:400;color:var(--charcoal);letter-spacing:.1px}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.content::-webkit-scrollbar{display:none}
.tabs{background:var(--surface);border-top:1px solid var(--border);display:flex;padding:8px 0 20px;flex-shrink:0}
@media(min-width:480px){.tabs{padding-bottom:8px}}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent}
.tab-l{font-size:10px;font-weight:500;letter-spacing:.2px}
.tab.on .tab-l{color:var(--slate)}
.tab:not(.on) .tab-l{color:var(--soft)}
.hdr{padding:15px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:var(--bg)}
.wm{font-family:var(--font-display);font-size:20px;font-weight:400;color:var(--slate);letter-spacing:.3px;font-style:italic}
.wm b{font-style:normal;font-weight:500;color:var(--charcoal)}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow)}
.p{padding:20px 22px}
.lbl{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--soft);margin-bottom:11px}
.btn{background:var(--slate);color:#fff;border:none;border-radius:99px;padding:13px 22px;font-family:var(--font-body);font-size:13px;font-weight:500;cursor:pointer}
.btn-out{background:transparent;color:var(--slate);border:1.5px solid var(--slate);border-radius:99px;padding:10px 18px;font-family:var(--font-body);font-size:13px;font-weight:500;cursor:pointer}
.btn-r{background:var(--rose-pale);color:var(--rose);border:none;border-radius:99px;padding:7px 14px;font-size:12px;font-weight:500;cursor:pointer}
.chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:500}
.chip-s{background:var(--slate-pale);color:var(--slate)}
.chip-r{background:var(--rose-pale);color:var(--rose)}
.avt{border-radius:50%;background:var(--slate-pale);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--font-display);font-size:14px;color:var(--slate)}
.trk{height:5px;background:var(--border);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--slate);border-radius:99px}
.fade{animation:fu .3s ease forwards}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:99px;outline:none;cursor:pointer;background:linear-gradient(to right,var(--slate) 0%,var(--slate) var(--pct,50%),var(--border) var(--pct,50%),var(--border) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--surface);border:2px solid var(--slate);box-shadow:0 1px 5px rgba(61,84,112,.15)}
.slot{background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:8px;font-size:12px;font-weight:500;color:var(--charcoal);cursor:pointer;text-align:center}
.slot.on{background:var(--slate);border-color:var(--slate);color:#fff}
.slot.off{opacity:.35;cursor:default}
.ndot{width:7px;height:7px;background:var(--rose);border-radius:50%;position:absolute;top:0;right:-1px}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const{useState,useRef,useEffect}=React;
const PAT={name:"Natalia",last:"Romero"};
const APT={date:"Miércoles, 2 de julio",time:"18:00 h",loc:"Jorge Juan 38",psic:"Dr. Pablo Herrera",area:"Ansiedad y gestión emocional"};
const FOCUS="Gestión del estrés laboral · semana 9";
const EXS=[
  {id:1,n:"Respiración 4-7-8",tipo:"Técnica de relajación",ico:"◯",freq:"3 × día o cuando notes tensión",desc:"Inhala 4 seg por la nariz, retén 7 seg, exhala lentamente 8 seg por la boca. La exhalación prolongada activa el nervio vago y reduce la respuesta del cortisol. Especialmente útil antes de reuniones estresantes."},
  {id:2,n:"Diario de pensamientos",tipo:"Registro cognitivo",ico:"◫",freq:"10 minutos cada noche",desc:"Anota el pensamiento automático, la emoción que generó (0-10), la evidencia a favor y en contra. Luego escribe un pensamiento alternativo más equilibrado. Con el tiempo, este ejercicio debilita los patrones cognitivos negativos."},
  {id:3,n:"Exposición gradual",tipo:"Tarea conductual",ico:"△",freq:"2 × semana",desc:"Esta semana: hablar en voz alta en la próxima reunión de equipo, aunque sea brevemente. Registro de ansiedad antes (SUDS) y después. Recuerda: la ansiedad sube y luego baja sola si no huyes — eso es lo que queremos aprender."},
  {id:4,n:"Actividad física programada",tipo:"Comportamiento de salud",ico:"◻",freq:"30 min × 4 días/semana",desc:"Cualquier ejercicio aeróbico de intensidad moderada reduce el cortisol circulante y aumenta la serotonina. No tiene que ser gimnasio — caminar rápido, nadar o bicicleta cuentan. La regularidad importa más que la intensidad."},
];
const DATA=[
  {w:"S1",anx:7.5,bienest:3.5},{w:"S2",anx:7,bienest:4},{w:"S3",anx:6.2,bienest:4.5},
  {w:"S4",anx:5.8,bienest:5.2},{w:"S5",anx:5,bienest:5.8},{w:"S6",anx:4.3,bienest:6.5},
  {w:"S7",anx:3.8,bienest:7},{w:"S8",anx:3.2,bienest:7.8},
];
const PSICS=[
  {loc:"Jorge Juan 38",ps:[{n:"Dr. Pablo Herrera",s:"Ansiedad y estrés",i:"PH"},{n:"Dra. Carmen Álvarez",s:"Terapia de pareja",i:"CA"},{n:"Dr. Marcos Vidal",s:"Depresión y duelo",i:"MV"}]},
  {loc:"Príncipe de Vergara 52",ps:[{n:"Dra. Laura Santos",s:"Psicología infantil",i:"LS"},{n:"Dr. Iván Torres",s:"Trastornos de ansiedad",i:"IT"}]},
];
const TIMES=[["10:00","11:00","12:00","—"],["—","17:00","18:00","19:00"],["20:00","—","—","—"]];
const DATES=[{d:"Lun",n:30,m:"Jun"},{d:"Mar",n:1,m:"Jul"},{d:"Mié",n:2,m:"Jul"},{d:"Jue",n:3,m:"Jul"},{d:"Vie",n:4,m:"Jul"}];
const MSGS=[
  {d:"23 jun",i:"PH",who:"Dr. Pablo Herrera",txt:"Sesión muy productiva. La exposición a la reunión fue un gran paso — registraste SUDS 7 antes y 3 después. Eso es exactamente lo que buscamos. Continúa con el ejercicio de respiración diario."},
  {d:"16 jun",i:"PH",who:"Dr. Pablo Herrera",txt:"Esta semana introduce el diario de pensamientos. Sé descriptiva, sin juzgarte. El objetivo es observar tus patrones, no cambiarlos todavía. Trae el diario a la próxima sesión."},
  {d:"9 jun",i:"CA",who:"Dra. Carmen Álvarez",txt:"Sesión de revisión intermedia. Los indicadores de bienestar general han mejorado desde el inicio del proceso. Seguimos con el enfoque en autocompasión y regulación del sistema nervioso."},
];

const Icon=({n,sz=22,c="currentColor"})=>{
  const I={
    home:<svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9.5L12 3l9 6.5V21a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 22V12h6v10"/></svg>,
    clip:<svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="12" y2="16"/></svg>,
    chart:<svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
    cal:<svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
    msg:<svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>,
    dn:<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>,
    up:<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="18 15 12 9 6 15"/></svg>,
    chk:<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
    loc:<svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>,
    send:<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
    bell:<svg width={sz} height={sz} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>,
  };
  return I[n]||null;
};

const TABS=[{id:"home",l:"Inicio",ic:"home"},{id:"plan",l:"Ejercicios",ic:"clip"},{id:"prog",l:"Bienestar",ic:"chart"},{id:"citas",l:"Sesiones",ic:"cal"},{id:"msgs",l:"Mensajes",ic:"msg"}];
const TabBar=({active,set})=>(
  <nav className="tabs">
    {TABS.map(t=>(
      <button key={t.id} className={`tab${active===t.id?" on":""}`} onClick={()=>set(t.id)}>
        <div style={{position:"relative"}}><Icon n={t.ic} sz={21} c={active===t.id?"var(--slate)":"var(--soft)"}/>{t.id==="msgs"&&<span className="ndot"/>}</div>
        <span className="tab-l">{t.l}</span>
      </button>
    ))}
  </nav>
);

const Home=({setTab})=>(
  <div className="fade" style={{padding:"0 22px 32px"}}>
    <div style={{paddingTop:12,paddingBottom:22}}>
      <p style={{fontSize:12,color:"var(--soft)",fontWeight:500,marginBottom:3}}>Hola de nuevo,</p>
      <h1 style={{fontFamily:"var(--font-display)",fontSize:28,fontWeight:400,color:"var(--charcoal)",lineHeight:1.2}}>{PAT.name} 🌿</h1>
      <p style={{fontSize:13,color:"var(--mid)",marginTop:5,fontStyle:"italic"}}>{FOCUS}</p>
    </div>
    <p className="lbl">Próxima sesión</p>
    <div className="card" style={{marginBottom:22}}>
      <div className="p">
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:16}}>
          <div><p style={{fontSize:12,color:"var(--soft)",marginBottom:2}}>{APT.date}</p><p style={{fontFamily:"var(--font-display)",fontSize:26,color:"var(--charcoal)"}}>{APT.time}</p></div>
          <span className="chip chip-s"><Icon n="loc" sz={10} c="var(--slate)"/>&nbsp;{APT.loc}</span>
        </div>
        <div style={{background:"var(--slate-faint)",borderRadius:10,padding:"12px 14px",display:"flex",gap:11,alignItems:"center",marginBottom:16}}>
          <div className="avt" style={{width:36,height:36}}>PH</div>
          <div><p style={{fontSize:13,fontWeight:500,color:"var(--charcoal)"}}>{APT.psic}</p><p style={{fontSize:11,color:"var(--soft)",marginTop:2,fontStyle:"italic"}}>{APT.area}</p></div>
        </div>
        <div style={{display:"flex",gap:9}}><button className="btn" style={{flex:1}}>Ver detalles</button><button className="btn-r">Reagendar</button></div>
      </div>
    </div>
    <div style={{background:"var(--parch)",borderRadius:14,padding:"18px 20px",marginBottom:22,border:"1px solid var(--border)"}}>
      <p style={{fontFamily:"var(--font-display)",fontSize:17,color:"var(--slate)",lineHeight:1.7,fontStyle:"italic"}}>"No puedes controlar todo lo que pasa, pero sí cómo respondes a ello."</p>
      <p style={{fontSize:11,color:"var(--soft)",marginTop:8,fontWeight:500}}>— Recordatorio semanal</p>
    </div>
    <p className="lbl">Esta semana</p>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:22}}>
      {[["Sesión 9 de 20","Tu proceso"],["Tarea pendiente","Diario × 3 días"]].map(([v,l])=>(
        <div key={l} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"14px 15px"}}>
          <p style={{fontFamily:"var(--font-display)",fontSize:18,color:"var(--slate)",lineHeight:1.2}}>{v}</p>
          <p style={{fontSize:11,color:"var(--soft)",marginTop:4,fontWeight:500}}>{l}</p>
        </div>
      ))}
    </div>
    <p className="lbl">Acceso rápido</p>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
      {[["Sesión","cal","citas","var(--slate)","var(--slate-pale)"],["Ejercicios","clip","plan","var(--rose)","var(--rose-pale)"],["Bienestar","chart","prog","var(--mid)","var(--parch)"]].map(([l,ic,tab,c,bg])=>(
        <button key={tab} onClick={()=>setTab(tab)} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"14px 8px",display:"flex",flexDirection:"column",alignItems:"center",gap:9,cursor:"pointer"}}>
          <div style={{width:38,height:38,borderRadius:10,background:bg,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon n={ic} sz={18} c={c}/></div>
          <p style={{fontSize:11,fontWeight:500,color:"var(--charcoal)",textAlign:"center",lineHeight:1.3}}>{l}</p>
        </button>
      ))}
    </div>
  </div>
);

const Plan=()=>{
  const[exp,setExp]=useState(null);
  return(<div className="fade" style={{padding:"0 22px 32px"}}>
    <div style={{paddingTop:12,paddingBottom:20}}>
      <p style={{fontSize:12,color:"var(--soft)",fontWeight:500,marginBottom:2}}>Tareas terapéuticas</p>
      <h2 style={{fontFamily:"var(--font-display)",fontSize:24,fontWeight:400,color:"var(--charcoal)",lineHeight:1.2}}>Ejercicios para esta semana</h2>
      <div style={{display:"flex",gap:8,alignItems:"center",marginTop:6}}>
        <div className="avt" style={{width:20,height:20,fontSize:9}}>PH</div>
        <p style={{fontSize:11,color:"var(--soft)"}}>Dr. Pablo Herrera · sesión del 23 jun 2025</p>
      </div>
    </div>
    <div style={{background:"var(--rose-pale)",borderRadius:10,padding:"12px 14px",marginBottom:16,display:"flex",gap:9}}>
      <span style={{fontSize:13}}>🌿</span>
      <p style={{fontSize:12,color:"var(--rose)",lineHeight:1.5}}>Recuerda: no hay ejercicios "correctos" o "incorrectos". Lo importante es observar, no juzgarte.</p>
    </div>
    <div style={{display:"flex",flexDirection:"column",gap:9}}>
      {EXS.map(e=>(
        <div key={e.id} style={{background:"var(--surface)",borderRadius:13,border:"1px solid var(--border)",overflow:"hidden"}}>
          <button onClick={()=>setExp(exp===e.id?null:e.id)} style={{width:"100%",background:"none",border:"none",cursor:"pointer",textAlign:"left",padding:"15px 17px"}}>
            <div style={{display:"flex",gap:13,alignItems:"flex-start"}}>
              <div style={{width:42,height:42,borderRadius:10,background:"var(--slate-faint)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:19,color:"var(--slate)",flexShrink:0}}>{e.ico}</div>
              <div style={{flex:1}}>
                <p style={{fontSize:14,fontWeight:500,color:"var(--charcoal)",marginBottom:2}}>{e.n}</p>
                <p style={{fontSize:11,color:"var(--slate)",fontWeight:500,marginBottom:3,fontStyle:"italic"}}>{e.tipo}</p>
                <p style={{fontSize:12,color:"var(--soft)",lineHeight:1.4,paddingRight:16}}>{e.freq}</p>
              </div>
              <div style={{color:"var(--soft)",flexShrink:0,marginTop:2}}>{exp===e.id?<Icon n="up"/>:<Icon n="dn"/>}</div>
            </div>
          </button>
          {exp===e.id&&<div style={{borderTop:"1px solid var(--border)",padding:"12px 17px"}}><p style={{fontSize:13,color:"var(--mid)",lineHeight:1.65,fontStyle:"italic"}}>{e.desc}</p></div>}
        </div>
      ))}
    </div>
  </div>);
};

const Prog=()=>{
  const[anx,setAnx]=useState(3);const[bie,setBie]=useState(8);const[sub,setSub]=useState(false);
  const[mood,setMood]=useState(null);
  return(<div className="fade" style={{padding:"0 22px 32px"}}>
    <div style={{paddingTop:12,paddingBottom:20}}>
      <p style={{fontSize:12,color:"var(--soft)",fontWeight:500,marginBottom:2}}>Seguimiento</p>
      <h2 style={{fontFamily:"var(--font-display)",fontSize:24,fontWeight:400,color:"var(--charcoal)"}}>Tu bienestar</h2>
    </div>
    <div style={{background:"var(--surface)",borderRadius:14,border:"1px solid var(--border)",padding:"18px 20px",marginBottom:20}}>
      <p style={{fontSize:13,color:"var(--mid)",marginBottom:14}}>¿Cómo te has sentido hoy?</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr 1fr",gap:8}}>
        {[["😔","Mal"],["😕","Regular"],["😐","Neutro"],["🙂","Bien"],["😊","Genial"]].map(([em,l],i)=>(
          <button key={i} onClick={()=>setMood(i)} style={{background:mood===i?"var(--slate-pale)":"var(--bg)",border:`1.5px solid ${mood===i?"var(--slate)":"var(--border)"}`,borderRadius:10,padding:"10px 4px",cursor:"pointer",textAlign:"center"}}>
            <p style={{fontSize:20,marginBottom:4}}>{em}</p>
            <p style={{fontSize:9,color:"var(--soft)",fontWeight:500}}>{l}</p>
          </button>
        ))}
      </div>
    </div>
    <p className="lbl">Check-in semanal</p>
    <div className="card" style={{marginBottom:20}}>
      <div className="p">
        {!sub?(<>
          <div style={{marginBottom:20}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:9}}>
              <p style={{fontSize:13,fontWeight:500,color:"var(--charcoal)"}}>Nivel de ansiedad hoy</p>
              <span style={{fontFamily:"var(--font-display)",fontSize:21,color:"var(--slate)"}}>{anx}<span style={{fontSize:12,color:"var(--soft)"}}>/ 10</span></span>
            </div>
            <input type="range" min="0" max="10" step=".5" value={anx} style={{"--pct":`${anx*10}%`}} onChange={e=>setAnx(Number(e.target.value))}/>
            <div style={{display:"flex",justifyContent:"space-between",marginTop:5}}><span style={{fontSize:10,color:"var(--soft)"}}>Tranquila</span><span style={{fontSize:10,color:"var(--soft)"}}>Ansiedad máxima</span></div>
          </div>
          <div style={{marginBottom:20}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:9}}>
              <p style={{fontSize:13,fontWeight:500,color:"var(--charcoal)"}}>Bienestar general</p>
              <span style={{fontFamily:"var(--font-display)",fontSize:21,color:"var(--rose)"}}>{bie}<span style={{fontSize:12,color:"var(--soft)"}}>/ 10</span></span>
            </div>
            <input type="range" min="0" max="10" step=".5" value={bie} style={{"--pct":`${bie*10}%`,"background":`linear-gradient(to right,var(--rose) 0%,var(--rose) ${bie*10}%,var(--border) ${bie*10}%,var(--border) 100%)`}} onChange={e=>setBie(Number(e.target.value))}/>
          </div>
          <button className="btn" style={{width:"100%"}} onClick={()=>setSub(true)}>Guardar registro</button>
        </>):(
          <div style={{textAlign:"center",padding:"16px 0 6px"}}>
            <p style={{fontFamily:"var(--font-display)",fontSize:20,color:"var(--charcoal)",marginBottom:5,fontStyle:"italic"}}>Registrado con cariño</p>
            <p style={{fontSize:13,color:"var(--soft)"}}>Pablo verá tus registros antes de la sesión.</p>
            <button className="btn-out" style={{marginTop:14}} onClick={()=>setSub(false)}>Editar</button>
          </div>
        )}
      </div>
    </div>
    <p className="lbl">Evolución — 8 semanas</p>
    <div className="card" style={{marginBottom:20}}>
      <div className="p" style={{paddingBottom:10}}>
        <div style={{display:"flex",gap:14,marginBottom:10}}>
          <div style={{display:"flex",gap:5,alignItems:"center"}}><div style={{width:9,height:2,borderRadius:1,background:"var(--slate)"}}/><span style={{fontSize:11,color:"var(--soft)"}}>Ansiedad</span></div>
          <div style={{display:"flex",gap:5,alignItems:"center"}}><div style={{width:9,height:2,borderRadius:1,background:"var(--rose)"}}/><span style={{fontSize:11,color:"var(--soft)"}}>Bienestar</span></div>
        </div>
        <svg viewBox="0 0 310 75" style={{width:"100%",height:"auto"}}>
          {DATA.map((d,i)=>{
            if(i===0)return null;
            const xs=j=>5+j*(300/7);const ys=v=>5+60-(v/10)*60;const prev=DATA[i-1];
            return(<g key={i}><line x1={xs(i-1)} y1={ys(prev.anx)} x2={xs(i)} y2={ys(d.anx)} stroke="var(--slate)" strokeWidth="2" strokeLinecap="round"/><line x1={xs(i-1)} y1={ys(prev.bienest)} x2={xs(i)} y2={ys(d.bienest)} stroke="var(--rose)" strokeWidth="2" strokeLinecap="round"/></g>);
          })}
          {DATA.map((d,i)=>{const xs=j=>5+j*(300/7);const ys=v=>5+60-(v/10)*60;return(<g key={i}><circle cx={xs(i)} cy={ys(d.anx)} r="2.5" fill="var(--surface)" stroke="var(--slate)" strokeWidth="1.8"/><circle cx={xs(i)} cy={ys(d.bienest)} r="2.5" fill="var(--surface)" stroke="var(--rose)" strokeWidth="1.8"/><text x={xs(i)} y={71} textAnchor="middle" fontSize="8" fill="var(--soft)" fontFamily="Mulish,sans-serif">{d.w}</text></g>)})}
        </svg>
        <div style={{background:"var(--slate-faint)",borderRadius:8,padding:"9px 11px",marginTop:8}}>
          <p style={{fontSize:12,color:"var(--slate)",fontStyle:"italic"}}>Ansiedad −<strong style={{fontStyle:"normal"}}>57%</strong> · Bienestar +<strong style={{fontStyle:"normal"}}>123%</strong></p>
        </div>
      </div>
    </div>
    <p className="lbl">Notas del terapeuta</p>
    {[{txt:"Natalia está mostrando una capacidad de observación interna notable. Los registros de pensamientos son cada vez más precisos. Esta es la base de todo lo que viene después."}].map((n,i)=>(
      <div key={i} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:13,padding:"15px 17px"}}>
        <div style={{display:"flex",gap:9,alignItems:"center",marginBottom:9}}><div className="avt" style={{width:28,height:28,fontSize:10}}>PH</div><p style={{fontSize:11,color:"var(--soft)"}}>23 jun · Dr. Pablo Herrera</p></div>
        <p style={{fontSize:13,color:"var(--charcoal)",lineHeight:1.7,fontStyle:"italic"}}>{n.txt}</p>
      </div>
    ))}
  </div>);
};

const Citas=()=>{
  const[loc,setLoc]=useState(null);const[psi,setPsi]=useState(null);const[dt,setDt]=useState(null);const[sl,setSl]=useState(null);const[done,setDone]=useState(false);
  if(done)return(<div className="fade" style={{padding:"0 22px 32px",display:"flex",flexDirection:"column",alignItems:"center",paddingTop:56}}>
    <div style={{width:68,height:68,borderRadius:"50%",background:"var(--slate-pale)",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:18,fontSize:28}}>🌿</div>
    <h2 style={{fontFamily:"var(--font-display)",fontSize:26,fontWeight:400,color:"var(--charcoal)",marginBottom:7}}>¡Sesión reservada!</h2>
    <p style={{fontSize:13,color:"var(--soft)",textAlign:"center",lineHeight:1.65,marginBottom:28,fontStyle:"italic"}}>Nos vemos pronto. Si necesitas hablar antes, recuerda que puedes enviar un mensaje.</p>
    <button className="btn-out" onClick={()=>{setDone(false);setLoc(null);setPsi(null);setDt(null);setSl(null)}}>Reservar otra sesión</button>
  </div>);
  const ps=loc?PSICS.find(l=>l.loc===loc)?.ps:[];
  return(<div className="fade" style={{padding:"0 22px 32px"}}>
    <div style={{paddingTop:12,paddingBottom:20}}>
      <p style={{fontSize:12,color:"var(--soft)",fontWeight:500,marginBottom:2}}>Nueva reserva</p>
      <h2 style={{fontFamily:"var(--font-display)",fontSize:24,fontWeight:400,color:"var(--charcoal)"}}>Reservar sesión</h2>
    </div>
    <p className="lbl">1. Centro</p>
    <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>
      {PSICS.map(l=>(
        <button key={l.loc} onClick={()=>{setLoc(l.loc);setPsi(null)}} style={{background:"var(--surface)",border:`1.5px solid ${loc===l.loc?"var(--slate)":"var(--border)"}`,borderRadius:11,padding:"13px 15px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",textAlign:"left"}}>
          <div><p style={{fontSize:13,fontWeight:500,color:"var(--charcoal)"}}>{l.loc}</p><p style={{fontSize:11,color:"var(--soft)",marginTop:2,fontStyle:"italic"}}>Bienestar Psicología · Madrid</p></div>
          {loc===l.loc&&<div style={{width:20,height:20,borderRadius:"50%",background:"var(--slate)",display:"flex",alignItems:"center",justifyContent:"center"}}><Icon n="chk" sz={11} c="white"/></div>}
        </button>
      ))}
    </div>
    {loc&&(<>
      <p className="lbl">2. Terapeuta</p>
      <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>
        {ps.map(p=>(
          <button key={p.n} onClick={()=>setPsi(p.n)} style={{background:"var(--surface)",border:`1.5px solid ${psi===p.n?"var(--slate)":"var(--border)"}`,borderRadius:11,padding:"12px 14px",display:"flex",alignItems:"center",gap:11,cursor:"pointer",textAlign:"left"}}>
            <div className="avt" style={{width:36,height:36,background:psi===p.n?"var(--slate)":"var(--slate-pale)",color:psi===p.n?"white":"var(--slate)"}}>{p.i}</div>
            <div style={{flex:1}}><p style={{fontSize:13,fontWeight:500,color:"var(--charcoal)"}}>{p.n}</p><span className="chip chip-s" style={{fontSize:10,marginTop:3,display:"inline-flex"}}>{p.s}</span></div>
          </button>
        ))}
      </div>
    </>)}
    {psi&&(<>
      <p className="lbl">3. Fecha</p>
      <div style={{display:"flex",gap:8,marginBottom:20,overflowX:"auto",paddingBottom:4}}>
        {DATES.map(d=>(
          <button key={d.n} onClick={()=>{setDt(d.n);setSl(null)}} style={{flexShrink:0,width:56,padding:"9px 4px",borderRadius:11,border:`1.5px solid ${dt===d.n?"var(--slate)":"var(--border)"}`,background:dt===d.n?"var(--slate)":"var(--surface)",cursor:"pointer",textAlign:"center"}}>
            <p style={{fontSize:9,fontWeight:500,color:dt===d.n?"rgba(255,255,255,.65)":"var(--soft)",textTransform:"uppercase",marginBottom:3}}>{d.d}</p>
            <p style={{fontFamily:"var(--font-display)",fontSize:20,color:dt===d.n?"white":"var(--charcoal)",lineHeight:1}}>{d.n}</p>
            <p style={{fontSize:9,color:dt===d.n?"rgba(255,255,255,.6)":"var(--soft)",marginTop:3}}>{d.m}</p>
          </button>
        ))}
      </div>
    </>)}
    {dt&&(<>
      <p className="lbl">4. Hora</p>
      <div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:22}}>
        {TIMES.map((row,ri)=>(
          <div key={ri} style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:7}}>
            {row.map((s,si)=><div key={si} className={`slot${s==="—"?" off":""}${sl===s?" on":""}`} onClick={()=>s!=="—"&&setSl(s)}>{s}</div>)}
          </div>
        ))}
      </div>
      {sl&&<button className="btn" style={{width:"100%",padding:"13px"}} onClick={()=>setDone(true)}>Confirmar · {sl} h</button>}
    </>)}
  </div>);
};

const Msgs=()=>{
  const[m,setM]=useState("");const[sent,setSent]=useState(false);
  const send=()=>m.trim()&&(setSent(true),setM(""),setTimeout(()=>setSent(false),3000));
  return(<div className="fade" style={{padding:"0 22px 32px"}}>
    <div style={{paddingTop:12,paddingBottom:20}}>
      <p style={{fontSize:12,color:"var(--soft)",fontWeight:500,marginBottom:2}}>Comunicación</p>
      <h2 style={{fontFamily:"var(--font-display)",fontSize:24,fontWeight:400,color:"var(--charcoal)"}}>Mensajes del proceso</h2>
    </div>
    {sent&&<div style={{background:"var(--slate-faint)",borderRadius:10,padding:"11px 13px",marginBottom:14,display:"flex",gap:8,alignItems:"center"}}><Icon n="chk" sz={14} c="var(--slate)"/><p style={{fontSize:13,color:"var(--slate)",fontWeight:500}}>Mensaje enviado.</p></div>}
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      {MSGS.map((msg,i)=>(
        <div key={i} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:13,padding:"15px 17px"}}>
          <p style={{fontSize:10,color:"var(--soft)",marginBottom:4,fontWeight:600,textTransform:"uppercase",letterSpacing:".6px"}}>{msg.d}</p>
          <div style={{display:"flex",gap:9,alignItems:"center",marginBottom:9}}><div className="avt" style={{width:26,height:26,fontSize:9}}>{msg.i}</div><p style={{fontSize:12,fontWeight:500,color:"var(--slate)"}}>{msg.who}</p></div>
          <p style={{fontSize:13,color:"var(--charcoal)",lineHeight:1.7,fontStyle:"italic"}}>{msg.txt}</p>
        </div>
      ))}
    </div>
    <div style={{marginTop:22}}>
      <p style={{fontSize:11,color:"var(--soft)",fontWeight:600,letterSpacing:".5px",textTransform:"uppercase",marginBottom:9}}>Mensaje a tu terapeuta</p>
      <div style={{background:"var(--surface)",border:"1.5px solid var(--border)",borderRadius:99,display:"flex",alignItems:"center",padding:"10px 16px",gap:9}}>
        <input type="text" placeholder="¿Algo que quieras comentar antes de la sesión?" value={m} onChange={e=>setM(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()} style={{flex:1,border:"none",outline:"none",fontFamily:"var(--font-body)",fontSize:13,color:"var(--charcoal)",background:"transparent"}}/>
        <button onClick={send} style={{background:"none",border:"none",cursor:"pointer"}}><Icon n="send" sz={16} c={m?"var(--slate)":"var(--soft)"}/></button>
      </div>
      <p style={{fontSize:11,color:"var(--soft)",marginTop:7,textAlign:"center",fontStyle:"italic"}}>Este espacio es privado y confidencial</p>
    </div>
  </div>);
};

const App=()=>{
  const[tab,setTab]=useState("home");const ref=useRef(null);
  useEffect(()=>{if(ref.current)ref.current.scrollTop=0},[tab]);
  const S={home:<Home setTab={setTab}/>,plan:<Plan/>,prog:<Prog/>,citas:<Citas/>,msgs:<Msgs/>};
  return(<div className="shell">
    <div className="sbar"><span className="sbar-t">9:41</span><div style={{display:"flex",gap:5,alignItems:"center"}}><svg width="15" height="11" viewBox="0 0 15 11" fill="none"><circle cx="7.5" cy="9" r="1.2" fill="#1E2830"/><path d="M7.5 5C9.5 5 11.3 6 12.5 7.5" stroke="#1E2830" strokeOpacity=".7" strokeWidth="1.3" strokeLinecap="round"/><path d="M7.5 2.5C10.5 2.5 13 4 14.5 6.5" stroke="#1E2830" strokeOpacity=".4" strokeWidth="1.3" strokeLinecap="round"/></svg><svg width="22" height="11" viewBox="0 0 22 11" fill="none"><rect x=".5" y=".5" width="18" height="10" rx="2" stroke="#1E2830" strokeOpacity=".4"/><rect x="1.5" y="1.5" width="13" height="8" rx="1.5" fill="#1E2830" fillOpacity=".85"/><path d="M20 4v3a1.5 1.5 0 000-3z" fill="#1E2830" fillOpacity=".4"/></svg></div></div>
    <div className="hdr">
      <span className="wm"><b>bienestar</b> psicología</span>
      <button style={{background:"none",border:"none",cursor:"pointer",position:"relative"}}><Icon n="bell" sz={19} c="var(--mid)"/><span className="ndot" style={{top:1,right:1}}/></button>
    </div>
    <div className="content" ref={ref}><div style={{padding:"18px 0 0"}}>{S[tab]}</div></div>
    <TabBar active={tab} set={setTab}/>
  </div>);
};
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
