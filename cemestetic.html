<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cemestetic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F3F8;
  --violet:#4F3D8A;
  --violet-lt:#EAE5F5;
  --lilac:#B7A8D9;
  --text:#241E33;
  --muted:#79718A;
  --surface:#FFFFFF;
  --border:#E2DCEC;
}
body{background:#CFC8DC;font-family:'Public Sans',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.phone{width:390px;height:844px;background:var(--bg);border-radius:44px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 32px 80px rgba(0,0,0,0.28),0 0 0 1px rgba(0,0,0,0.08)}
.status-bar{background:var(--violet);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 24px 10px;font-size:12px;font-weight:500;flex-shrink:0}
.screen{flex:1;overflow-y:auto;overflow-x:hidden}
.screen::-webkit-scrollbar{display:none}
.tab-bar{background:var(--surface);border-top:1px solid var(--border);display:flex;flex-shrink:0;padding-bottom:16px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 4px;cursor:pointer}
.tab span{font-size:10px;font-weight:600}
.tab.active{color:var(--violet)}
.tab:not(.active){color:var(--muted)}
.tab-icon{width:22px;height:22px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.screen > *{animation:fadeUp 0.25s ease forwards}
.app-header{background:var(--violet);padding:20px 24px 26px;color:#fff}
.wordmark{font-family:'Prata',serif;font-size:20px;letter-spacing:0.02em}
.wordmark em{font-family:'Public Sans',sans-serif;font-style:normal;opacity:0.65;font-size:11.5px;display:block;margin-top:3px}
.greeting{font-size:13px;font-weight:300;opacity:0.7;margin-top:16px}
.patient-name{font-family:'Prata',serif;font-size:21px;margin-top:3px}
.screen-title-bar{background:#fff;border-bottom:1px solid var(--border);padding:20px 20px 16px}
.screen-title{font-family:'Prata',serif;font-size:21px;color:var(--violet)}
.screen-sub{font-size:13px;color:var(--muted);margin-top:4px}
.section-label{font-size:11px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--muted);padding:20px 20px 8px}
.card{background:var(--surface);border-radius:14px;padding:18px;margin:0 16px 12px;box-shadow:0 1px 6px rgba(79,61,138,0.09)}
.appt-card{background:var(--violet);color:#fff;border-radius:14px;padding:18px;margin:16px 16px 12px}
.badge{background:rgba(255,255,255,0.22);border-radius:20px;padding:4px 11px;font-size:11px;font-weight:700;float:right}
.item-ico{width:38px;height:38px;border-radius:10px;background:var(--violet-lt);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.item-name{font-size:14px;font-weight:700;color:var(--text)}
.item-sub{font-size:12px;color:var(--muted);margin-top:2px}
.chev{color:var(--muted);transition:transform 0.2s}
.chev.open{transform:rotate(180deg)}
.expand-body{background:#F1EEF7;padding:13px 16px;font-size:13px;color:var(--muted);line-height:1.6;border-top:1px solid var(--border)}
.chart-label{font-size:10px;fill:var(--muted);font-family:'Public Sans',sans-serif}
.note-card{background:var(--violet-lt);border-left:3px solid var(--violet);border-radius:14px;padding:16px;margin:0 16px 12px}
.note-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--violet);margin-bottom:6px}
.note-text{font-size:13px;color:var(--text);line-height:1.55}
.option-card{background:var(--surface);border-radius:10px;padding:14px 16px;margin:0 16px 8px;display:flex;align-items:center;gap:12px;cursor:pointer;border:1.5px solid var(--border)}
.time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 16px 16px}
.time-chip{background:var(--surface);border-radius:8px;padding:10px 6px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);color:var(--text)}
.time-chip.selected{background:var(--violet);color:#fff;border-color:var(--violet)}
.time-chip.unavailable{background:#ECE8F2;color:#BAB1C9;cursor:default}
.confirm-btn{background:var(--violet);color:#fff;border-radius:50px;padding:16px;text-align:center;font-size:15px;font-weight:700;margin:8px 16px 20px;cursor:pointer}
.success-card{background:linear-gradient(135deg,var(--violet),#6B54B0);color:#fff;border-radius:14px;padding:28px;margin:20px 16px;text-align:center}
.msg-bubble{max-width:78%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.55;margin:4px 16px}
.msg-bubble.pro{background:var(--surface);color:var(--text);border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(79,61,138,0.08)}
.msg-bubble.user{background:var(--violet);color:#fff;border-bottom-right-radius:4px;margin-left:auto}
.msg-time{font-size:10px;color:var(--muted);margin:2px 16px 10px}
.msg-time.right{text-align:right}
.msg-sender{font-size:11px;font-weight:700;color:var(--violet);margin:12px 16px 4px}
.msg-input-row{background:var(--surface);border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;align-items:center;flex-shrink:0}
.msg-input{flex:1;background:var(--bg);border-radius:22px;padding:10px 16px;font-size:13px;font-family:'Public Sans',sans-serif;border:none;outline:none;color:var(--text)}
.msg-send{width:38px;height:38px;border-radius:50%;background:var(--violet);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.zone-chip{font-size:11px;font-weight:700;background:var(--violet-lt);color:var(--violet);border-radius:20px;padding:4px 11px;display:inline-block;margin:0 6px 6px 0}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const C="#4F3D8A",M="#79718A";
const Icons={
  home:a=><svg viewBox="0 0 24 24" fill={a?C:"none"} stroke={a?C:M} strokeWidth="1.8" className="tab-icon"><path d="M3 9.5L12 3l9 6.5V21H3V9.5z" strokeLinejoin="round"/></svg>,
  plan:a=><svg viewBox="0 0 24 24" fill="none" stroke={a?C:M} strokeWidth="1.8" className="tab-icon"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4" strokeLinecap="round"/></svg>,
  prog:a=><svg viewBox="0 0 24 24" fill="none" stroke={a?C:M} strokeWidth="1.8" className="tab-icon"><path d="M3 17l5-5 4 4 9-9" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  book:a=><svg viewBox="0 0 24 24" fill="none" stroke={a?C:M} strokeWidth="1.8" className="tab-icon"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18" strokeLinecap="round"/></svg>,
  msg:a=><svg viewBox="0 0 24 24" fill="none" stroke={a?C:M} strokeWidth="1.8" className="tab-icon"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z" strokeLinejoin="round"/></svg>
};
const Chev=({open})=><svg viewBox="0 0 24 24" fill="none" stroke={M} strokeWidth="2" width="18" height="18" className={`chev${open?' open':''}`}><path d="M6 9l6 6 6-6"/></svg>;

function Home(){
  return <div>
    <div className="app-header">
      <div className="wordmark">Cemestetic<em>Estética avanzada · Barrio de Salamanca</em></div>
      <div className="greeting">Bienvenida de nuevo,</div>
      <div className="patient-name">Patricia Egea</div>
    </div>
    <div className="appt-card">
      <div className="badge">Confirmada</div>
      <div style={{fontSize:11,opacity:0.7,textTransform:'uppercase',letterSpacing:'0.07em'}}>Próxima sesión</div>
      <div style={{fontFamily:"'Prata',serif",fontSize:19,marginTop:5}}>Jueves, 10 julio</div>
      <div style={{fontSize:13,opacity:0.85,marginTop:3}}>Depilación láser · sesión 5 de 8 · 17:30h</div>
    </div>
    <div className="section-label">Tratamiento láser</div>
    <div className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
        <span style={{fontFamily:"'Prata',serif",fontSize:17,color:C}}>Láser diodo · Sesión 5 de 8</span>
        <span style={{fontSize:12,color:M}}>62% completado</span>
      </div>
      <div style={{height:8,background:'#ECE8F2',borderRadius:4,overflow:'hidden',marginTop:12}}>
        <div style={{width:'62%',height:'100%',background:'linear-gradient(90deg,#4F3D8A,#B7A8D9)',borderRadius:4}}/>
      </div>
      <div style={{marginTop:14}}>
        <span className="zone-chip">Piernas completas</span>
        <span className="zone-chip">Axilas</span>
        <span className="zone-chip">Ingles</span>
      </div>
    </div>
    <div className="section-label">Accesos rápidos</div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,margin:'0 16px 16px'}}>
      {[['📅','Mis sesiones'],['🧴','Cuidados post-láser'],['💳','Mi bono'],['📷','Fotos de evolución']].map(([i,l])=>
        <div key={l} style={{background:'#fff',borderRadius:10,padding:16,border:'1.5px solid var(--border)',cursor:'pointer'}}>
          <div style={{fontSize:22}}>{i}</div>
          <div style={{fontSize:12,fontWeight:700,marginTop:6,color:'var(--text)'}}>{l}</div>
        </div>)}
    </div>
    <div className="card" style={{marginBottom:24}}>
      <div style={{fontSize:11,fontWeight:700,letterSpacing:'0.09em',textTransform:'uppercase',color:M,marginBottom:8}}>Recordatorio importante</div>
      <div style={{fontSize:13,color:'var(--text)',lineHeight:1.55}}>No te expongas al sol ni uses autobronceador en los <strong>3 días previos</strong> a tu sesión. Acude con la zona rasurada 24h antes.</div>
    </div>
  </div>;
}

function Plan(){
  const [open,setOpen]=useState(null);
  const items=[
    ['🧴','Gel calmante post-láser','48h tras cada sesión','Aplicar aloe o gel calmante 2-3 veces al día sobre las zonas tratadas. Evitar perfumes y exfoliantes 72h.'],
    ['☀️','Fotoprotección estricta','SPF 50+ · 2 semanas post-sesión','El sol sobre piel recién tratada puede causar manchas. Reaplicar cada 2-3 horas si hay exposición.'],
    ['🚿','Duchas templadas','72h tras cada sesión','Evitar agua muy caliente, saunas y piscinas con cloro los tres primeros días.'],
    ['🪒','Rasurado, nunca cera','Entre sesiones','La cera arranca el folículo y anula el efecto del láser. Solo cuchilla o crema depilatoria entre sesiones.'],
    ['💧','Hidratación corporal diaria','Todo el tratamiento','La piel hidratada responde mejor al láser y se recupera antes. Loción sin alcohol ni retinoides.'],
  ];
  return <div>
    <div className="screen-title-bar"><div className="screen-title">Cuidados del tratamiento</div><div className="screen-sub">Protocolo láser diodo · Cemestetic</div></div>
    <div style={{height:12}}/>
    {items.map(([ico,name,freq,det],i)=>
      <div key={i} style={{background:'#fff',borderRadius:14,margin:'0 16px 10px',overflow:'hidden',boxShadow:'0 1px 6px rgba(79,61,138,0.09)'}}>
        <div style={{display:'flex',alignItems:'center',gap:12,padding:'14px 18px',cursor:'pointer'}} onClick={()=>setOpen(open===i?null:i)}>
          <div className="item-ico">{ico}</div>
          <div style={{flex:1}}><div className="item-name">{name}</div><div className="item-sub">{freq}</div></div>
          <Chev open={open===i}/>
        </div>
        {open===i&&<div className="expand-body">{det}</div>}
      </div>)}
    <div className="note-card" style={{marginBottom:24}}>
      <div className="note-label">Nota de tu técnico</div>
      <div className="note-text">En la sesión 5 subimos ligeramente la potencia en piernas: la reducción está siendo excelente y la piel lo tolera muy bien.</div>
      <div style={{fontSize:11,color:M,marginTop:8}}>— Sandra, técnico láser</div>
    </div>
  </div>;
}

function Progress(){
  const red=[0,15,30,45,55,62,0,0];
  const shown=[0,15,30,45,55,62];
  const pts=shown.map((v,i)=>`${32+i*56},${90-(v/100)*72}`).join(' ');
  return <div>
    <div className="screen-title-bar"><div className="screen-title">Tu evolución</div><div className="screen-sub">Reducción de vello · por sesión</div></div>
    <div className="section-label">Reducción estimada</div>
    <div className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:12}}>
        <div style={{fontFamily:"'Prata',serif",fontSize:26,color:C}}>62%</div>
        <div style={{fontSize:12,color:C,fontWeight:700}}>Tras 4 sesiones · Muy buen ritmo</div>
      </div>
      <svg viewBox="0 0 332 100" style={{width:'100%',height:100,display:'block'}}>
        {[25,50,75].map(v=><g key={v}><line x1="32" y1={90-(v/100)*72} x2="312" y2={90-(v/100)*72} stroke="#ECE8F2"/><text x="6" y={93-(v/100)*72} className="chart-label">{v}%</text></g>)}
        <polyline points={pts} fill="none" stroke={C} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
        {shown.map((v,i)=><circle key={i} cx={32+i*56} cy={90-(v/100)*72} r={i===5?4:2.5} fill={i===5?"#B7A8D9":C}/>)}
        {['Inicio','S1','S2','S3','S4','Hoy'].map((m,i)=><text key={m} x={32+i*56} y="100" className="chart-label" textAnchor="middle">{m}</text>)}
      </svg>
    </div>
    <div className="section-label">Por zona</div>
    {[['Piernas completas','68%'],['Axilas','72%'],['Ingles','55%']].map(([l,v])=>
      <div key={l} className="card">
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
          <span style={{fontSize:13,fontWeight:700}}>{l}</span>
          <span style={{fontFamily:"'Prata',serif",fontSize:17,color:C}}>{v}</span>
        </div>
        <div style={{height:8,background:'#ECE8F2',borderRadius:4,overflow:'hidden'}}><div style={{width:v,height:'100%',background:'linear-gradient(90deg,#4F3D8A,#B7A8D9)',borderRadius:4}}/></div>
      </div>)}
    <div className="note-card" style={{marginBottom:24}}>
      <div className="note-label">Previsión</div>
      <div className="note-text">Con la respuesta actual, estimamos una reducción superior al 90% al completar las 8 sesiones, con un repaso de mantenimiento anual opcional.</div>
    </div>
  </div>;
}

function Bookings(){
  const [step,setStep]=useState(0),[sel,setSel]=useState({}),[done,setDone]=useState(false);
  const pros=[['Sandra Millán','Técnico láser'],['Eva Cordero','Estética facial'],['Dra. Pilar Antón','Medicina estética'],['Noelia Vidal','Tratamientos corporales']];
  const svcs=[['Sesión láser (mi bono)','Incluida'],['Higiene facial profunda','75€'],['Radiofrecuencia facial','95€'],['Presoterapia','45€']];
  const times=['10:00','11:00','12:00','13:00','16:00','16:30','17:30','18:30','19:30'];
  const unav=['11:00','16:00','18:30'];
  if(done)return <div>
    <div className="screen-title-bar"><div className="screen-title">Citas</div></div>
    <div className="success-card">
      <div style={{fontSize:44,marginBottom:10}}>✦</div>
      <div style={{fontFamily:"'Prata',serif",fontSize:21,marginBottom:6}}>Sesión reservada</div>
      <div style={{fontSize:13,opacity:0.85}}>{sel.pro} · {sel.svc}</div>
      <div style={{fontSize:13,opacity:0.85,marginTop:3}}>{sel.time}</div>
    </div>
    <div className="confirm-btn" onClick={()=>{setDone(false);setStep(0);setSel({})}}>Nueva reserva</div>
  </div>;
  return <div>
    <div className="screen-title-bar">
      <div className="screen-title">Citas</div>
      <div style={{display:'flex',gap:6,marginTop:12}}>
        {['Especialista','Servicio','Hora'].map((s,i)=><div key={s} style={{flex:1,height:3,borderRadius:2,background:i<=step?C:'#E2DCEC'}}/>)}
      </div>
    </div>
    {step===0&&<><div className="section-label">Con quién</div>
      {pros.map(([n,r])=><div key={n} className="option-card" onClick={()=>{setSel({...sel,pro:n});setStep(1)}}>
        <div className="item-ico">✨</div><div><div className="item-name">{n}</div><div className="item-sub">{r}</div></div></div>)}</>}
    {step===1&&<><div className="section-label">Elige servicio</div>
      {svcs.map(([n,p])=><div key={n} className="option-card" onClick={()=>{setSel({...sel,svc:n});setStep(2)}}>
        <div style={{flex:1}}><div className="item-name">{n}</div></div><div style={{fontWeight:700,color:C,fontSize:13}}>{p}</div></div>)}</>}
    {step===2&&<><div className="section-label">Hora · Jueves 10 julio</div>
      <div className="time-grid">{times.map(t=><div key={t} className={`time-chip${unav.includes(t)?' unavailable':sel.time===t?' selected':''}`} onClick={()=>!unav.includes(t)&&setSel({...sel,time:t})}>{t}</div>)}</div>
      {sel.time&&<div className="confirm-btn" onClick={()=>setDone(true)}>Confirmar</div>}</>}
  </div>;
}

function Messages(){
  const msgs=[
    ['pro','Sandra','Patricia, ¿qué tal la piel tras la última sesión? ¿Alguna rojez que durase más de 24h?','Hace 3 días'],
    ['user',null,'Ninguna, solo un poco de calor las primeras horas. Todo perfecto.','Hace 3 días'],
    ['pro','Sandra','Genial. El jueves subimos un punto la potencia en piernas entonces. Recuerda venir con la zona rasurada del día anterior.','Hace 3 días'],
    ['pro','Recepción','Tu bono de 8 sesiones incluye una higiene facial de cortesía. ¡Puedes reservarla desde la app cuando quieras!','Ayer'],
    ['user',null,'¡Anotado! La reservo para finales de mes.','Hoy'],
  ];
  return <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
    <div className="screen-title-bar" style={{flexShrink:0}}><div className="screen-title">Mensajes</div><div className="screen-sub">Cemestetic · Barrio de Salamanca</div></div>
    <div style={{flex:1,overflowY:'auto',padding:'12px 0'}}>
      {msgs.map(([from,name,text,time],i)=><div key={i}>
        {from==='pro'&&<div className="msg-sender">{name}</div>}
        <div className={`msg-bubble ${from}`}>{text}</div>
        <div className={`msg-time${from==='user'?' right':''}`}>{time}</div>
      </div>)}
    </div>
    <div className="msg-input-row">
      <input className="msg-input" placeholder="Escribe un mensaje…" readOnly/>
      <div className="msg-send"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></div>
    </div>
  </div>;
}

function App(){
  const [tab,setTab]=useState(0);
  const screens=[Home,Plan,Progress,Bookings,Messages];
  const S=screens[tab];
  const tabs=[['Inicio',Icons.home],['Cuidados',Icons.plan],['Evolución',Icons.prog],['Citas',Icons.book],['Mensajes',Icons.msg]];
  return <div className="phone">
    <div className="status-bar"><span>9:41</span>
      <div style={{display:'flex',gap:6,alignItems:'center'}}>
        <svg width="16" height="12" viewBox="0 0 16 12"><rect x="0" y="3" width="3" height="9" rx="1" fill="white" opacity="0.4"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="white" opacity="0.6"/><rect x="9" y="0.5" width="3" height="11.5" rx="1" fill="white" opacity="0.8"/><rect x="13.5" y="0" width="2.5" height="12" rx="1" fill="white"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="1" width="22" height="10" rx="2" stroke="white" strokeWidth="1" fill="none" opacity="0.5"/><rect x="23" y="3.5" width="2" height="5" rx="1" fill="white" opacity="0.5"/><rect x="1.5" y="2.5" width="16" height="7" rx="1" fill="white"/></svg>
      </div>
    </div>
    <div className="screen" key={tab}><S/></div>
    <div className="tab-bar">{tabs.map(([l,I],i)=><div key={i} className={`tab${tab===i?' active':''}`} onClick={()=>setTab(i)}>{I(tab===i)}<span>{l}</span></div>)}</div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
